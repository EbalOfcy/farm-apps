<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzeria Forno</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #FFFDF9);
            --text-color: var(--tg-theme-text-color, #2C1A1D);
            --hint-color: var(--tg-theme-hint-color, #8C7A6B);
            --link-color: var(--tg-theme-link-color, #8B0000);
            --button-color: var(--tg-theme-button-color, #8B0000);
            --button-text-color: var(--tg-theme-button-text-color, #FFFFFF);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #F4EBE1);
            
            --brand-red: #8B0000;
            --brand-cream: #FDFBF7;
            --brand-cream-dark: #F4EBE1;
            --brand-dark: #2C1A1D;
            --border-radius: 12px;
            --font-size-base: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size-base);
            line-height: 1.4;
            padding-bottom: 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px 0;
            border-bottom: 2px solid var(--secondary-bg-color);
            margin-bottom: 20px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            fill: var(--brand-red);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--brand-red);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--hint-color);
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .pizza-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pizza-card {
            background: var(--secondary-bg-color);
            border-radius: var(--border-radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .pizza-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .pizza-img {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .pizza-info {
            flex-grow: 1;
        }

        .pizza-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .pizza-desc {
            font-size: 15px;
            color: var(--hint-color);
        }

        .size-selector {
            display: flex;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .size-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .size-btn.active {
            background: var(--brand-red);
            color: #FFFFFF;
        }

        .pizza-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .pizza-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-color);
        }

        .add-btn {
            background: var(--brand-red);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        .cart-section {
            margin-top: 32px;
            background: var(--secondary-bg-color);
            border-radius: var(--border-radius);
            padding: 20px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            gap: 8px;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 16px;
            font-weight: 700;
        }

        .cart-item-sub {
            font-size: 14px;
            color: var(--hint-color);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: var(--brand-red);
            color: #FFFFFF;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .qty-val {
            font-size: 16px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .cart-empty-text {
            text-align: center;
            color: var(--hint-color);
            padding: 16px 0;
            font-size: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--hint-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--brand-red);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            padding-top: 12px;
            border-top: 2px dashed var(--hint-color);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-group">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.43 2 5.23 3.54 3.01 6L12 22L20.99 6C18.77 3.54 15.57 2 12 2ZM7 7C7.55 7 8 7.45 8 8C8 8.55 7.55 9 7 9C6.45 9 6 8.55 6 8C6 7.45 6.45 7 7 7ZM11.5 13C10.67 13 10 12.33 10 11.5C10 10.67 10.67 10 11.5 10C12.33 10 13 10.67 13 11.5C13 12.33 12.33 13 11.5 13ZM15 8C14.45 8 14 7.55 14 7C14 6.45 14.45 6 15 6C15.55 6 16 6.45 16 7C16 7.55 15.55 8 15 8Z"/>
                </svg>
                <div>
                    <div class="brand-title">FORNO</div>
                    <div class="brand-subtitle">Семейная пиццерия</div>
                </div>
            </div>
        </header>

        <main>
            <div class="section-title">Меню пиццы</div>
            <div id="pizza-list" class="pizza-grid"></div>

            <div class="cart-section">
                <div class="section-title">Ваш заказ</div>
                <div id="cart-items-container" class="cart-items"></div>

                <div class="total-row">
                    <span>Итого к оплате:</span>
                    <span id="cart-total">0 ₽</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="address-input">Адрес доставки *</label>
                    <input type="text" id="address-input" class="form-input" placeholder="Улица, дом, квартира">
                </div>

                <div class="form-group">
                    <label class="form-label" for="comment-input">Комментарий курьеру</label>
                    <input type="text" id="comment-input" class="form-input" placeholder="Код домофона, подъезд, этаж">
                </div>
            </div>
        </main>
    </div>

    <script>
        const PIZZAS = [
            {
                id: 'margherita',
                name: 'Маргарита',
                description: 'Сочные томаты, нежная моцарелла, свежий базилик и фирменный томатный соус.',
                basePrice: 450
            },
            {
                id: 'pepperoni',
                name: 'Пепперони',
                description: 'Пикантная пепперони, увеличенная порция моцареллы, томатный соус.',
                basePrice: 550
            },
            {
                id: 'four-cheeses',
                name: 'Четыре сыра',
                description: 'Сливочный соус, моцарелла, горгонзола, пармезан, чеддер.',
                basePrice: 620
            },
            {
                id: 'capricciosa',
                name: 'Капричоза',
                description: 'Ветчина, свежие шампиньоны, артишоки, оливки, моцарелла.',
                basePrice: 590
            },
            {
                id: 'bbq-chicken',
                name: 'Цыпленок Барбекю',
                description: 'Филе цыпленка, соус барбекю, красный лук, моцарелла, бекон.',
                basePrice: 580
            },
            {
                id: 'diavola',
                name: 'Дьявола',
                description: 'Острая салями, перец халапеньо, моцарелла, томатный соус, чили.',
                basePrice: 570
            },
            {
                id: 'prosciutto-funghi',
                name: 'Прошутто Фунги',
                description: 'Итальянская ветчина, ароматные шампиньоны, моцарелла, томатный соус.',
                basePrice: 560
            },
            {
                id: 'hawaiian',
                name: 'Гавайская',
                description: 'Сочная ветчина, сладкие ананасы, моцарелла, томатный соус.',
                basePrice: 530
            }
        ];

        let selectedSizes = {};
        let cart = [];

        const tg = window.Telegram?.WebApp;

        function initApp() {
            if (tg) {
                tg.ready();
                tg.expand();
                tg.MainButton.setText('ОФОРМИТЬ ЗАКАЗ');
                tg.MainButton.hide();
                tg.MainButton.onClick(handleCheckout);
            }

            PIZZAS.forEach(pizza => {
                selectedSizes[pizza.id] = 25;
            });

            renderMenu();
            renderCart();

            document.getElementById('address-input').addEventListener('input', updateMainButtonState);
        }

        function triggerHaptic(type = 'light') {
            if (tg && tg.HapticFeedback) {
                if (type === 'selection') {
                    tg.HapticFeedback.selectionChanged();
                } else if (type === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.HapticFeedback.impactOccurred(type);
                }
            }
        }

        function createPizzaSvg() {
            return `
                <svg class="pizza-img" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#E29578" />
                    <circle cx="50" cy="50" r="38" fill="#FFDDD2" />
                    <circle cx="50" cy="50" r="34" fill="#E26D5C" />
                    <circle cx="35" cy="35" r="6" fill="#8B0000" />
                    <circle cx="65" cy="40" r="7" fill="#8B0000" />
                    <circle cx="45" cy="65" r="6" fill="#8B0000" />
                    <circle cx="60" cy="60" r="5" fill="#226F54" />
                    <circle cx="35" cy="55" r="4" fill="#226F54" />
                    <circle cx="50" cy="30" r="5" fill="#226F54" />
                </svg>
            `;
        }

        function renderMenu() {
            const container = document.getElementById('pizza-list');
            container.innerHTML = '';

            PIZZAS.forEach(pizza => {
                const card = document.createElement('div');
                card.className = 'pizza-card';

                const size = selectedSizes[pizza.id];
                const price = pizza.basePrice + (size === 35 ? 250 : 0);

                card.innerHTML = `
                    <div class="pizza-header">
                        ${createPizzaSvg()}
                        <div class="pizza-info">
                            <div class="pizza-name">${pizza.name}</div>
                            <div class="pizza-desc">${pizza.description}</div>
                        </div>
                    </div>
                    <div class="size-selector">
                        <button class="size-btn ${size === 25 ? 'active' : ''}" data-id="${pizza.id}" data-size="25">25 см</button> #ИНТЕРАКТИВ
                        <button class="size-btn ${size === 35 ? 'active' : ''}" data-id="${pizza.id}" data-size="35">35 см (+250 ₽)</button> #ИНТЕРАКТИВ
                    </div>
                    <div class="pizza-bottom">
                        <div class="pizza-price">${price} ₽</div>
                        <button class="add-btn" data-id="${pizza.id}">В корзину</button> #ИНТЕРАКТИВ
                    </div>
                `;

                const sizeBtns = card.querySelectorAll('.size-btn');
                sizeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const pid = e.target.getAttribute('data-id');
                        const psize = parseInt(e.target.getAttribute('data-size'), 10);
                        selectedSizes[pid] = psize;
                        triggerHaptic('selection');
                        renderMenu();
                    });
                });

                const addBtn = card.querySelector('.add-btn');
                addBtn.addEventListener('click', () => {
                    addToCart(pizza.id, selectedSizes[pizza.id]);
                    triggerHaptic('medium');
                });

                container.appendChild(card);
            });
        }

        function addToCart(pizzaId, size) {
            const pizza = PIZZAS.find(p => p.id === pizzaId);
            const price = pizza.basePrice + (size === 35 ? 250 : 0);
            const existingIndex = cart.findIndex(item => item.id === pizzaId && item.size === size);

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    id: pizzaId,
                    name: pizza.name,
                    size: size,
                    price: price,
                    qty: 1
                });
            }

            renderCart();
        }

        function updateQuantity(index, delta) {
            triggerHaptic('light');
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function calculateTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('cart-total');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty-text">Ваша корзина пуста</div>';
                totalEl.textContent = '0 ₽';
                updateMainButtonState();
                return;
            }

            cart.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-sub">${item.size} см • ${item.price} ₽</div>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn btn-minus" data-index="${index}">-</button> #ИНТЕРАКТИВ
                        <span class="qty-val">${item.qty}</span>
                        <button class="qty-btn btn-plus" data-index="${index}">+</button> #ИНТЕРАКТИВ
                    </div>
                `;

                const minusBtn = itemEl.querySelector('.btn-minus');
                const plusBtn = itemEl.querySelector('.btn-plus');

                minusBtn.addEventListener('click', () => updateQuantity(index, -1));
                plusBtn.addEventListener('click', () => updateQuantity(index, 1));

                container.appendChild(itemEl);
            });

            const total = calculateTotal();
            totalEl.textContent = `${total} ₽`;

            updateMainButtonState();
        }

        function updateMainButtonState() {
            const address = document.getElementById('address-input').value.trim();
            const total = calculateTotal();

            if (!tg) return;

            if (cart.length > 0 && address.length > 0) {
                tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ (${total} ₽)`);
                tg.MainButton.show();
                tg.MainButton.enable();
            } else {
                if (cart.length > 0) {
                    tg.MainButton.setText('УКАЖИТЕ АДРЕС ДОСТАВКИ');
                    tg.MainButton.show();
                    tg.MainButton.disable();
                } else {
                    tg.MainButton.hide();
                }
            }
        }

        function handleCheckout() {
            const address = document.getElementById('address-input').value.trim();
            const comment = document.getElementById('comment-input').value.trim();

            if (cart.length === 0 || !address) {
                return;
            }

            triggerHaptic('success');

            const orderPayload = {
                restaurant: "Pizzeria Forno",
                items: cart.map(item => ({
                    name: item.name,
                    size: `${item.size} см`,
                    quantity: item.qty,
                    price: item.price,
                    subtotal: item.price * item.qty
                })),
                totalPrice: calculateTotal(),
                address: address,
                comment: comment
            };

            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(orderPayload));
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
