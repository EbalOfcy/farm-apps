<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzeria Forno</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #FDFBF7);
            --text-color: var(--tg-theme-text-color, #2C1A1D);
            --hint-color: var(--tg-theme-hint-color, #8C7B75);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #FAF4EB);
            --button-color: var(--tg-theme-button-color, #8B0000);
            --button-text-color: var(--tg-theme-button-text-color, #FFFDD0);
            --forno-red: #8B0000;
            --forno-red-dark: #660000;
            --forno-cream: #FFFDD0;
            --forno-cream-light: #FDFBF7;
            --border-color: rgba(139, 0, 0, 0.15);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 18px;
            line-height: 1.4;
            padding-bottom: 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 8px auto;
            display: block;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--forno-red);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 15px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pizza-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .pizza-card {
            background-color: var(--secondary-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .pizza-card-header {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .pizza-svg-icon {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
        }

        .pizza-info {
            flex-grow: 1;
        }

        .pizza-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .pizza-description {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.3;
        }

        .size-selector {
            display: flex;
            background-color: var(--bg-color);
            border-radius: var(--radius-md);
            padding: 4px;
            gap: 4px;
            border: 1px solid var(--border-color);
        }

        .size-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .size-btn.active {
            background-color: var(--forno-red);
            color: var(--forno-cream);
        }

        .pizza-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .pizza-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--forno-red);
        }

        .add-to-cart-btn {
            background-color: var(--forno-red);
            color: var(--forno-cream);
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }

        .add-to-cart-btn:active {
            opacity: 0.85;
        }

        .cart-section {
            background-color: var(--secondary-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .cart-empty {
            text-align: center;
            padding: 24px 0;
            color: var(--hint-color);
            font-size: 16px;
        }

        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 17px;
            font-weight: 700;
        }

        .cart-item-meta {
            font-size: 14px;
            color: var(--hint-color);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .qty-count {
            font-size: 16px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--hint-color);
            padding: 4px;
            margin-left: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 2px solid var(--border-color);
            font-size: 20px;
            font-weight: 800;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-input, .form-textarea {
            width: 100%;
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: var(--text-color);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--forno-red);
        }

        .form-textarea {
            resize: vertical;
            min-height: 70px;
        }

        .input-error {
            border-color: #d32f2f !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <svg class="header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#8B0000" />
                <path d="M50 15 L80 75 L20 75 Z" fill="#FFFDD0" />
                <circle cx="45" cy="50" r="5" fill="#C0392B" />
                <circle cx="58" cy="62" r="4" fill="#C0392B" />
                <circle cx="38" cy="65" r="4" fill="#27AE60" />
                <circle cx="52" cy="38" r="3" fill="#27AE60" />
            </svg>
            <h1 class="header-title">Forno</h1>
            <p class="header-subtitle">Семейная пиццерия с традиционной печью</p>
        </header>

        <main>
            <h2 class="section-title">Меню пиццы</h2>
            <div id="pizza-grid" class="pizza-grid"></div>

            <h2 class="section-title">Корзина</h2>
            <div class="cart-section">
                <div id="cart-container"></div>
            </div>

            <h2 class="section-title">Детали доставки</h2>
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label" for="delivery-address">Адрес доставки *</label>
                    <input type="text" id="delivery-address" class="form-input" placeholder="Улица, дом, квартира, подъезд">
                </div>
                <div class="form-group">
                    <label class="form-label" for="courier-comment">Комментарий для курьера</label>
                    <textarea id="courier-comment" class="form-textarea" placeholder="Код домофона, этаж или пожелания"></textarea>
                </div>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || {
            ready: () => {},
            expand: () => {},
            MainButton: {
                setText: () => {},
                show: () => {},
                hide: () => {},
                onClick: (cb) => { window._mainBtnClick = cb; },
                offClick: () => {},
                enable: () => {},
                disable: () => {},
                isVisible: false
            },
            HapticFeedback: {
                impactOccurred: () => {},
                notificationOccurred: () => {}
            },
            sendData: (data) => console.log('SendData output:', data)
        };

        tg.ready();
        tg.expand();

        const PIZZA_DATA = [
            { id: 1, name: "Маргарита", desc: "Томатный соус, моцарелла, свежий базилик, оливковое масло", price25: 550 },
            { id: 2, name: "Пепперони", desc: "Пикантная пепперони, моцарелла, фирменный томатный соус", price25: 650 },
            { id: 3, name: "Четыре сыра", desc: "Моцарелла, горгонзола, пармезан, проволоне, сливочный соус", price25: 750 },
            { id: 4, name: "Капричоза", desc: "Ветчина, шампиньоны, артишоки, маслины, моцарелла", price25: 700 },
            { id: 5, name: "Прошутто э Фунги", desc: "Итальянская ветчина, свежие шампиньоны, моцарелла", price25: 680 },
            { id: 6, name: "Дьявола", desc: "Острая салями, халапеньо, перец чили, моцарелла", price25: 690 },
            { id: 7, name: "Карбонара", desc: "Бекон, сливочный соус, пармезан, яичный желток, моцарелла", price25: 720 },
            { id: 8, name: "Цыпленок Барбекю", desc: "Филе цыпленка, красный лук, соус BBQ, моцарелла", price25: 710 }
        ];

        const state = {
            selectedSizes: {},
            cart: []
        };

        PIZZA_DATA.forEach(p => {
            state.selectedSizes[p.id] = 25;
        });

        function createPizzaSvg() {
            return `
            <svg class="pizza-svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="42" fill="#E67E22" stroke="#D35400" stroke-width="4"/>
                <circle cx="50" cy="50" r="35" fill="#F1C40F"/>
                <circle cx="40" cy="35" r="6" fill="#C0392B"/>
                <circle cx="65" cy="45" r="5" fill="#C0392B"/>
                <circle cx="45" cy="65" r="6" fill="#C0392B"/>
                <circle cx="32" cy="52" r="4" fill="#27AE60"/>
                <circle cx="58" cy="30" r="3" fill="#27AE60"/>
                <circle cx="60" cy="62" r="4" fill="#27AE60"/>
                <circle cx="50" cy="48" r="5" fill="#C0392B"/>
            </svg>`;
        }

        function renderCatalog() {
            const grid = document.getElementById('pizza-grid');
            grid.innerHTML = '';

            PIZZA_DATA.forEach(pizza => {
                const currentSize = state.selectedSizes[pizza.id];
                const price = currentSize === 25 ? pizza.price25 : pizza.price25 + 250;

                const card = document.createElement('div');
                card.className = 'pizza-card';

                const header = document.createElement('div');
                header.className = 'pizza-card-header';
                header.innerHTML = `${createPizzaSvg()}
                    <div class="pizza-info">
                        <div class="pizza-title">${pizza.name}</div>
                        <div class="pizza-description">${pizza.desc}</div>
                    </div>`;

                const sizeSelector = document.createElement('div');
                sizeSelector.className = 'size-selector';

                const btn25 = document.createElement('button'); // #ИНТЕРАКТИВ
                btn25.className = `size-btn ${currentSize === 25 ? 'active' : ''}`; // #ИНТЕРАКТИВ
                btn25.textContent = '25 см'; // #ИНТЕРАКТИВ
                btn25.onclick = () => setPizzaSize(pizza.id, 25); // #ИНТЕРАКТИВ

                const btn35 = document.createElement('button'); // #ИНТЕРАКТИВ
                btn35.className = `size-btn ${currentSize === 35 ? 'active' : ''}`; // #ИНТЕРАКТИВ
                btn35.textContent = '35 см (+250 ₽)'; // #ИНТЕРАКТИВ
                btn35.onclick = () => setPizzaSize(pizza.id, 35); // #ИНТЕРАКТИВ

                sizeSelector.appendChild(btn25);
                sizeSelector.appendChild(btn35);

                const footer = document.createElement('div');
                footer.className = 'pizza-card-footer';

                const priceEl = document.createElement('div');
                priceEl.className = 'pizza-price';
                priceEl.textContent = `${price} ₽`;

                const addBtn = document.createElement('button'); // #ИНТЕРАКТИВ
                addBtn.className = 'add-to-cart-btn'; // #ИНТЕРАКТИВ
                addBtn.innerHTML = `<span>+</span> <span>Добавить</span>`; // #ИНТЕРАКТИВ
                addBtn.onclick = () => addToCart(pizza.id); // #ИНТЕРАКТИВ

                footer.appendChild(priceEl);
                footer.appendChild(addBtn);

                card.appendChild(header);
                card.appendChild(sizeSelector);
                card.appendChild(footer);

                grid.appendChild(card);
            });
        }

        function setPizzaSize(pizzaId, size) {
            state.selectedSizes[pizzaId] = size;
            tg.HapticFeedback.impactOccurred('light');
            renderCatalog();
        }

        function addToCart(pizzaId) {
            const pizza = PIZZA_DATA.find(p => p.id === pizzaId);
            const size = state.selectedSizes[pizzaId];
            const price = size === 25 ? pizza.price25 : pizza.price25 + 250;

            const existingIndex = state.cart.findIndex(item => item.id === pizzaId && item.size === size);

            if (existingIndex > -1) {
                state.cart[existingIndex].quantity += 1;
            } else {
                state.cart.push({
                    id: pizza.id,
                    name: pizza.name,
                    size: size,
                    price: price,
                    quantity: 1
                });
            }

            tg.HapticFeedback.impactOccurred('medium');
            renderCart();
            updateMainButton();
        }

        function updateQuantity(index, delta) {
            state.cart[index].quantity += delta;
            if (state.cart[index].quantity <= 0) {
                state.cart.splice(index, 1);
            }
            tg.HapticFeedback.impactOccurred('light');
            renderCart();
            updateMainButton();
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            tg.HapticFeedback.impactOccurred('medium');
            renderCart();
            updateMainButton();
        }

        function calculateTotal() {
            return state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            container.innerHTML = '';

            if (state.cart.length === 0) {
                container.innerHTML = `<div class="cart-empty">Ваша корзина пока пуста</div>`;
                return;
            }

            const list = document.createElement('div');
            list.className = 'cart-items-list';

            state.cart.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';

                const details = document.createElement('div');
                details.className = 'cart-item-details';
                details.innerHTML = `
                    <div class="cart-item-title">${item.name} (${item.size} см)</div>
                    <div class="cart-item-meta">${item.price} ₽ × ${item.quantity} = ${item.price * item.quantity} ₽</div>
                `;

                const controls = document.createElement('div');
                controls.className = 'cart-item-controls';

                const decBtn = document.createElement('button'); // #ИНТЕРАКТИВ
                decBtn.className = 'qty-btn'; // #ИНТЕРАКТИВ
                decBtn.textContent = '-'; // #ИНТЕРАКТИВ
                decBtn.onclick = () => updateQuantity(index, -1); // #ИНТЕРАКТИВ

                const countEl = document.createElement('span');
                countEl.className = 'qty-count';
                countEl.textContent = item.quantity;

                const incBtn = document.createElement('button'); // #ИНТЕРАКТИВ
                incBtn.className = 'qty-btn'; // #ИНТЕРАКТИВ
                incBtn.textContent = '+'; // #ИНТЕРАКТИВ
                incBtn.onclick = () => updateQuantity(index, 1); // #ИНТЕРАКТИВ

                const removeBtn = document.createElement('button'); // #ИНТЕРАКТИВ
                removeBtn.className = 'remove-btn'; // #ИНТЕРАКТИВ
                removeBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                    </svg>`; // #ИНТЕРАКТИВ
                removeBtn.onclick = () => removeFromCart(index); // #ИНТЕРАКТИВ

                controls.appendChild(decBtn);
                controls.appendChild(countEl);
                controls.appendChild(incBtn);
                controls.appendChild(removeBtn);

                itemEl.appendChild(details);
                itemEl.appendChild(controls);
                list.appendChild(itemEl);
            });

            const summary = document.createElement('div');
            summary.className = 'cart-summary';
            summary.innerHTML = `<span>Итого:</span><span>${calculateTotal()} ₽</span>`;

            container.appendChild(list);
            container.appendChild(summary);
        }

        function updateMainButton() {
            const addressInput = document.getElementById('delivery-address');
            const total = calculateTotal();
            const address = addressInput.value.trim();

            if (state.cart.length === 0) {
                tg.MainButton.hide();
                return;
            }

            tg.MainButton.show();

            if (!address) {
                tg.MainButton.setText("ВВЕДИТЕ АДРЕС ДОСТАВКИ");
                tg.MainButton.disable();
            } else {
                tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ • ${total} ₽`);
                tg.MainButton.enable();
            }
        }

        document.getElementById('delivery-address').addEventListener('input', (e) => {
            if (e.target.value.trim()) {
                e.target.classList.remove('input-error');
            }
            updateMainButton();
        });

        tg.MainButton.onClick(() => {
            const address = document.getElementById('delivery-address').value.trim();
            const comment = document.getElementById('courier-comment').value.trim();

            if (state.cart.length === 0) {
                return;
            }

            if (!address) {
                document.getElementById('delivery-address').classList.add('input-error');
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            const orderPayload = {
                items: state.cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    size: item.size,
                    quantity: item.quantity,
                    price: item.price
                })),
                totalAmount: calculateTotal(),
                address: address,
                comment: comment
            };

            tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify(orderPayload));
        });

        renderCatalog();
        renderCart();
        updateMainButton();
    </script>
</body>
</html>
