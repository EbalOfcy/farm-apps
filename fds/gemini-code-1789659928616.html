<body>
  <div class="container">
    <header>
      <h1>Forno</h1>
      <p>Family Pizzeria</p>
    </header>

    <main>
      <div id="catalog-view" class="view active">
        <div id="pizza-list" class="pizza-list"></div>
        <div class="cart-summary-bar">
          <div>
            <div style="font-size: 14px; color: var(--hint-color);">Total</div>
            <div id="catalog-total" style="font-size: 22px; font-weight: bold;">0 ₽</div>
          </div>
          <button id="go-to-cart-btn" class="view-cart-btn">View Cart</button> <!-- #ИНТЕРАКТИВ -->
        </div>
      </div>

      <div id="cart-view" class="view">
        <h2 style="margin-bottom: 16px; color: var(--brand-red);">Your Order</h2>
        <div id="cart-items" class="cart-items"></div>
        
        <div id="checkout-form" style="display: none;">

            <label for="address-input">Delivery Address *</label>
            <input type="text" id="address-input" placeholder="Street, house, apartment">
          </div>
          <div class="form-group">
            <label for="comment-input">Courier Comment</label>
            <textarea id="comment-input" placeholder="Door code, floor, special instructions..."></textarea>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const PIZZAS = [
      { id: 1, name: "Margherita", desc: "Classic tomato sauce, fresh mozzarella, aromatic basil, olive oil", price25: 450 },
      { id: 2, name: "Pepperoni", desc: "Spicy pepperoni, mozzarella, signature tomato sauce", price25: 550 },
      { id: 3, name: "Quattro Formaggi", desc: "Mozzarella, gorgonzola, parmesan, provolone, cream sauce", price25: 650 },
      { id: 4, name: "Diablo", desc: "Spicy salami, jalapeños, red onion, chili flakes, tomato sauce", price25: 580 },
      { id: 5, name: "Capricciosa", desc: "Prosciutto ham, mushrooms, artichokes, black olives, mozzarella", price25: 620 },
      { id: 6, name: "BBQ Chicken", desc: "Grilled chicken breast, crispy bacon, red onion, BBQ sauce", price25: 590 },
      { id: 7, name: "Vegetariana", desc: "Bell peppers, zucchini, eggplant, cherry tomatoes, pesto", price25: 490 },
      { id: 8, name: "Carbonara", desc: "Crispy pancetta, egg yolk sauce, parmesan, mozzarella, black pepper", price25: 610 }
    ];

    const state = {
      selectedSizes: {},
      cart: [],
      currentView: 'catalog'
    };

    PIZZAS.forEach(p => {
      state.selectedSizes[p.id] = '25';
    });

    const catalogView = document.getElementById('catalog-view');
    const cartView = document.getElementById('cart-view');
    const pizzaListEl = document.getElementById('pizza-list');
    const cartItemsEl = document.getElementById('cart-items');
    const catalogTotalEl = document.getElementById('catalog-total');
    const goToCartBtn = document.getElementById('go-to-cart-btn');
    const addressInput = document.getElementById('address-input');
    const commentInput = document.getElementById('comment-input');

    function renderCatalog() {
      pizzaListEl.innerHTML = '';
      PIZZAS.forEach(pizza => {
        const size = state.selectedSizes[pizza.id];
        const price = size === '35' ? pizza.price25 + 250 : pizza.price25;

        const card = document.createElement('div');
        card.className = 'pizza-card';
        card.innerHTML = `
          <div class="pizza-header">
            <span class="pizza-title">${pizza.name}</span>
          </div>
          <div class="pizza-desc">${pizza.desc}</div>
          <div class="size-selector">
            <button class="size-btn ${size === '25' ? 'active' : ''}" data-id="${pizza.id}" data-size="25">25 cm</button> <!-- #ИНТЕРАКТИВ -->
            <button class="size-btn ${size === '35' ? 'active' : ''}" data-id="${pizza.id}" data-size="35">35 cm</button> <!-- #ИНТЕРАКТИВ -->
          </div>
          <div class="pizza-bottom">
            <span class="pizza-price">${price} ₽</span>
            <button class="add-btn" data-id="${pizza.id}">Add</button> <!-- #ИНТЕРАКТИВ -->
          </div>
        `;

        const sizeBtns = card.querySelectorAll('.size-btn');
        sizeBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            const pId = parseInt(e.target.dataset.id);
            const pSize = e.target.dataset.size;
            state.selectedSizes[pId] = pSize;
            renderCatalog();
          });
        });

        const addBtn = card.querySelector('.add-btn');
        addBtn.addEventListener('click', () => {
          addToCart(pizza.id, state.selectedSizes[pizza.id]);
          if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
          }
        });

        pizzaListEl.appendChild(card);
      });

      updateTotals();
    }

    function addToCart(pizzaId, size) {
      const pizza = PIZZAS.find(p => p.id === pizzaId);
      const price = size === '35' ? pizza.price25 + 250 : pizza.price25;
      const existing = state.cart.find(item => item.id === pizzaId && item.size === size);

      if (existing) {
        existing.quantity += 1;
      } else {
        state.cart.push({
          id: pizzaId,
          name: pizza.name,
          size: size,
          price: price,
          quantity: 1
        });
      }
      updateTotals();
    }

    function updateCartQuantity(pizzaId, size, delta) {
      const index = state.cart.findIndex(item => item.id === pizzaId && item.size === size);
      if (index !== -1) {
        state.cart[index].quantity += delta;
        if (state.cart[index].quantity <= 0) {
          state.cart.splice(index, 1);
        }
      }
      renderCart();
      updateTotals();
    }

    function calculateTotal() {
      return state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    function updateTotals() {
      const total = calculateTotal();
      catalogTotalEl.textContent = `${total} ₽`;

      if (state.currentView === 'cart' && state.cart.length > 0) {
        tg.MainButton.setText(`CHECKOUT (${total} ₽)`);
        tg.MainButton.show();
      } else if (state.currentView === 'cart' && state.cart.length === 0) {
        tg.MainButton.hide();
      } else {
        tg.MainButton.hide();
      }
    }

    function renderCart() {
      cartItemsEl.innerHTML = '';
      const checkoutForm = document.getElementById('checkout-form');

      if (state.cart.length === 0) {
        cartItemsEl.innerHTML = '<div class="empty-cart-msg">Your cart is empty</div>';
        checkoutForm.style.display = 'none';
        return;
      }

      checkoutForm.style.display = 'block';

      state.cart.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'cart-item';
        itemEl.innerHTML = `
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <p>${item.size} cm — ${item.price} ₽</p>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn minus-btn">-</button> <!-- #ИНТЕРАКТИВ -->
            <span style="font-weight: bold; font-size: 18px;">${item.quantity}</span>
            <button class="qty-btn plus-btn">+</button> <!-- #ИНТЕРАКТИВ -->
          </div>
        `;

        itemEl.querySelector('.minus-btn').addEventListener('click', () => {
          updateCartQuantity(item.id, item.size, -1);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        itemEl.querySelector('.plus-btn').addEventListener('click', () => {
          updateCartQuantity(item.id, item.size, 1);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        cartItemsEl.appendChild(itemEl);
      });
    }

    function showView(viewName) {
      state.currentView = viewName;
      if (viewName === 'catalog') {
        catalogView.classList.add('active');
        cartView.classList.remove('active');
        tg.BackButton.hide();
      } else {
        catalogView.classList.remove('active');
        cartView.classList.add('active');
        renderCart();
        tg.BackButton.show();
      }
      updateTotals();
    }

    goToCartBtn.addEventListener('click', () => {
      showView('cart');
    });

    tg.BackButton.onClick(() => {
      showView('catalog');
    });

    addressInput.addEventListener('input', () => {
      updateTotals();
    });

    tg.MainButton.onClick(() => {
      if (state.cart.length === 0) return;

      const address = addressInput.value.trim();
      if (!address) {
        tg.showAlert('Please enter a delivery address.');
        return;
      }

      const orderData = {
        items: state.cart,
        total: calculateTotal(),
        address: address,
        comment: commentInput.value.trim()
      };

      tg.sendData(JSON.stringify(orderData));
    });

    renderCatalog();
  </script>
