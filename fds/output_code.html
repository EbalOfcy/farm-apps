<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Forno — пицца</title> <script src="https://telegram.org/js/telegram-web-app.js"></script> <style> :root { --bg: var(--tg-theme-bg-color, #1a0f0f); --text: var(--tg-theme-text-color, #f5e6d3); --hint: var(--tg-theme-hint-color, #c4a484); --link: var(--tg-theme-link-color, #e8b86d); --btn: var(--tg-theme-button-color, #8b1a1a); --btn-text: var(--tg-theme-button-text-color, #f5e6d3); --sec: var(--tg-theme-secondary-bg-color, #2a1818); --accent: #8b1a1a; --cream: #f5e6d3; } * { box-sizing: border-box; margin: 0; padding: 0; } html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; line-height: 1.45; min-height: 100%; -webkit-tap-highlight-color: transparent; } .wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px 120px; } header { text-align: center; padding: 12px 0 20px; } header h1 { font-size: 1.7rem; font-weight: 700; color: var(--cream); letter-spacing: 0.02em; } header p { color: var(--hint); font-size: 0.95rem; margin-top: 4px; } .pizza { background: var(--sec); border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(139, 26, 26, 0.35); } .pizza-name { font-size: 1.15rem; font-weight: 600; color: var(--cream); } .pizza-desc { color: var(--hint); font-size: 0.9rem; margin: 4px 0 10px; } .pizza-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .price { font-weight: 700; color: var(--link); font-size: 1.05rem; min-width: 70px; } .sizes { display: flex; gap: 6px; } .size-btn { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: transparent; color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer; min-height: 40px; } .size-btn.active { background: var(--accent); color: var(--cream); } .add-btn { margin-left: auto; padding: 10px 16px; border: none; border-radius: 10px; background: var(--btn); color: var(--btn-text); font-size: 0.95rem; font-weight: 600; cursor: pointer; min-height: 42px; min-width: 72px; } .add-btn:active { opacity: 0.85; } .section-title { font-size: 1.25rem; font-weight: 700; color: var(--cream); margin: 22px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); } .cart-empty { color: var(--hint); text-align: center; padding: 18px 0; font-size: 0.95rem; } .cart-item { display: flex; align-items: center; gap: 10px; background: var(--sec); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid rgba(139, 26, 26, 0.25); } .cart-info { flex: 1; min-width: 0; } .cart-name { font-weight: 600; color: var(--cream); } .cart-meta { color: var(--hint); font-size: 0.88rem; margin-top: 2px; } .cart-qty { display: flex; align-items: center; gap: 6px; } .qty-btn { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--text); font-size: 1.2rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; } .qty-val { min-width: 24px; text-align: center; font-weight: 600; } .cart-sum { font-weight: 700; color: var(--link); min-width: 64px; text-align: right; } .remove-btn { width: 36px; height: 36px; border: none; border-radius: 8px; background: rgba(139, 26, 26, 0.25); color: #e07070; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; } .total-line { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 12px 4px; font-size: 1.15rem; font-weight: 700; } .total-line span:last-child { color: var(--link); } .fields { margin-top: 8px; } label { display: block; color: var(--hint); font-size: 0.88rem; margin-bottom: 4px; margin-top: 12px; } input, textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid rgba(139, 26, 26, 0.4); background: var(--sec); color: var(--text); font-size: 1rem; font-family: inherit; outline: none; } input:focus, textarea:focus { border-color: var(--accent); } textarea { resize: vertical; min-height: 64px; } .error { color: #e07070; font-size: 0.88rem; margin-top: 8px; display: none; } .error.show { display: block; } </style> </head> <body> <div class="wrap"> <header> <h1>Forno</h1> <p>Семейная пиццерия · доставка</p> </header> <div id="menu"></div> <div class="section-title">Корзина</div> <div id="cart"></div> <div class="total-line" id="totalLine" style="display:none"> <span>Итого</span> <span id="totalSum">0 ₽</span> </div> <div class="section-title">Доставка</div> <div class="fields"> <label for="address">Адрес доставки *</label> <input type="text" id="address" placeholder="Улица, дом, квартира" autocomplete="street-address"> <!-- #ИНТЕРАКТИВ --> <label for="comment">Комментарий курьеру</label> <textarea id="comment" placeholder="Код домофона, этаж, пожелания…"></textarea> <!-- #ИНТЕРАКТИВ --> <div class="error" id="errMsg"></div> </div> </div> <script> const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); tg.enableClosingConfirmation(); const PIZZAS = [ { id: 1, name: 'Маргарита', desc: 'Томаты, моцарелла, базилик, оливковое масло', base: 420 }, { id: 2, name: 'Пепперони', desc: 'Пепперони, моцарелла, томатный соус', base: 520 }, { id: 3, name: 'Четыре сыра', desc: 'Моцарелла, горгонзола, пармезан, чеддер', base: 560 }, { id: 4, name: 'Гавайская', desc: 'Ветчина, ананас, моцарелла, томатный соус', base: 490 }, { id: 5, name: 'Барбекю', desc: 'Курица, бекон, соус BBQ, красный лук, моцарелла', base: 540 }, { id: 6, name: 'Грибная', desc: 'Шампиньоны, белые грибы, моцарелла, сливочный соус', base: 480 }, { id: 7, name: 'Дьявола', desc: 'Острая салями, халапеньо, моцарелла, томатный соус', base: 530 }, { id: 8, name: 'Средиземноморская', desc: 'Оливки, вяленые томаты, фета, руккола, моцарелла', base: 550 } ]; const SIZE_EXTRA = 250; let cart = []; // { pizzaId, name, size, price, qty } let selectedSize = {}; // pizzaId -> 25|35 PIZZAS.forEach(p => { selectedSize[p.id] = 25; }); function priceOf(base, size) { return size === 35 ? base + SIZE_EXTRA : base; } function renderMenu() { const el = document.getElementById('menu'); el.innerHTML = PIZZAS.map(p => { const sz = selectedSize[p.id]; const pr = priceOf(p.base, sz); return ` <div class="pizza" data-id="${p.id}"> <div class="pizza-name">${p.name}</div> <div class="pizza-desc">${p.desc}</div> <div class="pizza-row"> <div class="price" id="price-${p.id}">${pr} ₽</div> <div class="sizes"> <button class="size-btn ${sz === 25 ? 'active' : ''}" data-size="25" data-id="${p.id}">25 см</button> <!-- #ИНТЕРАКТИВ --> <button class="size-btn ${sz === 35 ? 'active' : ''}" data-size="35" data-id="${p.id}">35 см</button> <!-- #ИНТЕРАКТИВ --> </div> <button class="add-btn" data-id="${p.id}">Добавить</button> <!-- #ИНТЕРАКТИВ --> </div> </div>`; }).join(''); } function renderCart() { const el = document.getElementById('cart'); const totalLine = document.getElementById('totalLine'); const totalSum = document.getElementById('totalSum'); if (cart.length === 0) { el.innerHTML = '<div class="cart-empty">Корзина пуста — выберите пиццу</div>'; totalLine.style.display = 'none'; updateMainButton(0); return; } let total = 0; el.innerHTML = cart.map((item, idx) => { const line = item.price * item.qty; total += line; return ` <div class="cart-item"> <div class="cart-info"> <div class="cart-name">${item.name}</div> <div class="cart-meta">${item.size} см · ${item.price} ₽</div> </div> <div class="cart-qty"> <button class="qty-btn" data-act="minus" data-idx="${idx}">−</button> <!-- #ИНТЕРАКТИВ --> <span class="qty-val">${item.qty}</span> <button class="qty-btn" data-act="plus" data-idx="${idx}">+</button> <!-- #ИНТЕРАКТИВ --> </div> <div class="cart-sum">${line} ₽</div> <button class="remove-btn" data-idx="${idx}" title="Удалить">×</button> <!-- #ИНТЕРАКТИВ --> </div>`; }).join(''); totalLine.style.display = 'flex'; totalSum.textContent = total + ' ₽'; updateMainButton(total); } function updateMainButton(total) { if (total > 0) { tg.MainButton.setText('Заказать · ' + total + ' ₽'); tg.MainButton.show(); } else { tg.MainButton.hide(); } } function addToCart(id) { const pizza = PIZZAS.find(p => p.id === id); const size = selectedSize[id]; const price = priceOf(pizza.base, size); const existing = cart.find(c => c.pizzaId === id && c.size === size); if (existing) { existing.qty += 1; } else { cart.push({ pizzaId: id, name: pizza.name, size, price, qty: 1 }); } if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); renderCart(); } function changeQty(idx, delta) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); renderCart(); } function removeItem(idx) { cart.splice(idx, 1); if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium'); renderCart(); } document.getElementById('menu').addEventListener('click', e => { const sizeBtn = e.target.closest('.size-btn'); if (sizeBtn) { const id = +sizeBtn.dataset.id; const size = +sizeBtn.dataset.size; selectedSize[id] = size; const pizza = PIZZAS.find(p => p.id === id); document.getElementById('price-' + id).textContent = priceOf(pizza.base, size) + ' ₽'; sizeBtn.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active')); sizeBtn.classList.add('active'); return; } const addBtn = e.target.closest('.add-btn'); if (addBtn) { addToCart(+addBtn.dataset.id); } }); document.getElementById('cart').addEventListener('click', e => { const qtyBtn = e.target.closest('.qty-btn'); if (qtyBtn) { const idx = +qtyBtn.dataset.idx; const act = qtyBtn.dataset.act; changeQty(idx, act === 'plus' ? 1 : -1); return; } const rm = e.target.closest('.remove-btn'); if (rm) removeItem(+rm.dataset.idx); }); function showError(msg) { const err = document.getElementById('errMsg'); err.textContent = msg; err.classList.add('show'); setTimeout(() => err.classList.remove('show'), 3500); } tg.MainButton.onClick(() => { const address = document.getElementById('address').value.trim(); const comment = document.getElementById('comment').value.trim(); if (cart.length === 0) { showError('Добавьте хотя бы одну пиццу'); if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error'); return; } if (!address) { showError('Укажите адрес доставки'); document.getElementById('address').focus(); if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error'); return; } const total = cart.reduce((s, i) => s + i.price * i.qty, 0); const payload = { items: cart.map(i => ({ name: i.name, size: i.size + ' см', price: i.price, qty: i.qty, sum: i.price * i.qty })), address, comment, total }; if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); tg.sendData(JSON.stringify(payload)); }); renderMenu(); renderCart(); </script> </body> </html>
