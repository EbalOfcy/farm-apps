<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzeria Forno</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #FFFDF9);
            --text-color: var(--tg-theme-text-color, #2C1810);
            --hint-color: var(--tg-theme-hint-color, #8C7A6B);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #F5EBE6);
            --button-color: var(--tg-theme-button-color, #8B0000);
            --button-text: var(--tg-theme-button-text-color, #FFFFFF);
            
            --brand-red: #8B0000;
            --brand-cream: #FFFDF9;
            --accent-border: #D9C3B0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 18px;
            line-height: 1.4;
            padding-bottom: 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--brand-red);
        }

        h1 {
            font-size: 32px;
            color: var(--brand-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--hint-color);
        }

        .section-title {
            font-size: 22px;
            margin: 20px 0 12px 0;
            color: var(--brand-red);
        }

        .pizza-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pizza-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--accent-border);
        }

        .pizza-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .pizza-title {
            font-size: 20px;
            font-weight: bold;
        }

        .pizza-desc {
            font-size: 15px;
            color: var(--hint-color);
        }

        .size-selector {
            display: flex;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .size-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .size-btn.active {
            background-color: var(--brand-red);
            color: var(--brand-cream);
        }

        .pizza-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .add-btn {
            background-color: var(--brand-red);
            color: var(--brand-cream);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-section {
            margin-top: 28px;
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--accent-border);
        }

        .cart-empty {
            color: var(--hint-color);
            font-size: 16px;
            text-align: center;
            padding: 12px 0;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--accent-border);
        }

        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: bold;
            font-size: 16px;
        }

        .cart-item-sub {
            font-size: 14px;
            color: var(--hint-color);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--accent-border);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .remove-btn {
            background-color: transparent;
            color: var(--brand-red);
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 8px;
        }

        .form-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-border);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--brand-red);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Forno</h1>
            <div class="subtitle">Семейная пиццерия</div>
        </header>

        <div class="section-title">Меню</div>
        <div class="pizza-list" id="pizza-list"></div>

        <div class="cart-section">
            <div class="section-title" style="margin-top: 0;">Корзина</div>
            <div id="cart-content">
                <div class="cart-empty">Корзина пуста</div>
            </div>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label for="address">Адрес доставки *</label>
                <input type="text" id="address" placeholder="Улица, дом, квартира">
            </div>
            <div class="input-group">
                <label for="comment">Комментарий к заказу</label>
                <textarea id="comment" placeholder="Подъезд, код домофона, пожелания"></textarea>
            </div>
        </div>
    </div>

    <script>
        const pizzasData = [
            { id: 1, name: "Маргарита", desc: "Томатный соус, моцарелла, свежий базилик, оливковое масло", basePrice: 450 },
            { id: 2, name: "Пепперони", desc: "Острая пепперони, моцарелла, томатный соус, орегано", basePrice: 550 },
            { id: 3, name: "Четыре сыра", desc: "Моцарелла, горгонзола, пармезан, чеддер, белый соус", basePrice: 620 },
            { id: 4, name: "Капричоза", desc: "Ветчина, шампиньоны, артишоки, оливки, моцарелла", basePrice: 590 },
            { id: 5, name: "Дьявола", desc: "Острая салями, халапеньо, моцарелла, томатный соус, чили", basePrice: 580 },
            { id: 6, name: "Прошутто Рукола", desc: "Прошутто крудо, свежая рукола, пармезан, томаты черри", basePrice: 680 },
            { id: 7, name: "Гавайская", desc: "Сочная куриная грудка, ананасы, моцарелла, томатный соус", basePrice: 530 },
            { id: 8, name: "Грибная с трюфелем", desc: "Лесные грибы, шампиньоны, трюфельное масло, моцарелла", basePrice: 650 }
        ];

        const selectedSizes = {};
        const cart = [];

        const tg = window.Telegram.WebApp;

        function initApp() {
            tg.ready();
            tg.expand();

            pizzasData.forEach(p => {
                selectedSizes[p.id] = 25;
            });

            renderPizzaList();
            renderCart();
            setupEventListeners();
            updateMainButton();
        }

        function renderPizzaList() {
            const container = document.getElementById("pizza-list");
            container.innerHTML = "";

            pizzasData.forEach(pizza => {
                const currentSize = selectedSizes[pizza.id];
                const currentPrice = pizza.basePrice + (currentSize === 35 ? 250 : 0);

                const card = document.createElement("div");
                card.className = "pizza-card";

                card.innerHTML = `
                    <div class="pizza-header">
                        <div class="pizza-title">${pizza.name}</div>
                    </div>
                    <div class="pizza-desc">${pizza.desc}</div>
                    <div class="size-selector">
                        <button class="size-btn ${currentSize === 25 ? 'active' : ''}" data-id="${pizza.id}" data-size="25">25 см</button> #ИНТЕРАКТИВ
                        <button class="size-btn ${currentSize === 35 ? 'active' : ''}" data-id="${pizza.id}" data-size="35">35 см</button> #ИНТЕРАКТИВ
                    </div>
                    <div class="pizza-footer">
                        <div class="price">${currentPrice} ₽</div>
                        <button class="add-btn" data-id="${pizza.id}">В корзину</button> #ИНТЕРАКТИВ
                    </div>
                `;

                const sizeButtons = card.querySelectorAll(".size-btn");
                sizeButtons.forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const pid = parseInt(e.target.getAttribute("data-id"));
                        const size = parseInt(e.target.getAttribute("data-size"));
                        selectedSizes[pid] = size;
                        renderPizzaList();
                        if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                    });
                });

                const addBtn = card.querySelector(".add-btn");
                addBtn.addEventListener("click", () => {
                    addToCart(pizza.id, selectedSizes[pizza.id]);
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                });

                container.appendChild(card);
            });
        }

        function addToCart(pizzaId, size) {
            const pizza = pizzasData.find(p => p.id === pizzaId);
            const price = pizza.basePrice + (size === 35 ? 250 : 0);

            const existingIndex = cart.findIndex(item => item.id === pizzaId && item.size === size);

            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: pizza.id,
                    name: pizza.name,
                    size: size,
                    price: price,
                    quantity: 1
                });
            }

            renderCart();
            updateMainButton();
        }

        function updateQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
            updateMainButton();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateMainButton();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function renderCart() {
            const container = document.getElementById("cart-content");

            if (cart.length === 0) {
                container.innerHTML = `<div class="cart-empty">Корзина пуста</div>`;
                return;
            }

            const cartItemsContainer = document.createElement("div");
            cartItemsContainer.className = "cart-items";

            cart.forEach((item, index) => {
                const itemEl = document.createElement("div");
                itemEl.className = "cart-item";
                itemEl.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name} (${item.size} см)</div>
                        <div class="cart-item-sub">${item.price} ₽ × ${item.quantity} = ${item.price * item.quantity} ₽</div>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn dec-btn" data-index="${index}">-</button> #ИНТЕРАКТИВ
                        <span>${item.quantity}</span>
                        <button class="qty-btn inc-btn" data-index="${index}">+</button> #ИНТЕРАКТИВ
                        <button class="remove-btn" data-index="${index}">✕</button> #ИНТЕРАКТИВ
                    </div>
                `;

                itemEl.querySelector(".dec-btn").addEventListener("click", () => updateQuantity(index, -1));
                itemEl.querySelector(".inc-btn").addEventListener("click", () => updateQuantity(index, 1));
                itemEl.querySelector(".remove-btn").addEventListener("click", () => removeFromCart(index));

                cartItemsContainer.appendChild(itemEl);
            });

            container.innerHTML = "";
            container.appendChild(cartItemsContainer);
        }

        function calculateTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }

        function updateMainButton() {
            const address = document.getElementById("address").value.trim();
            const total = calculateTotal();

            if (cart.length > 0 && address.length > 0) {
                tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ (${total} ₽)`);
                tg.MainButton.show();
            } else if (cart.length > 0 && address.length === 0) {
                tg.MainButton.setText(`УКАЖИТЕ АДРЕС ДОСТАВКИ`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        function setupEventListeners() {
            const addressInput = document.getElementById("address");
            addressInput.addEventListener("input", updateMainButton);

            tg.MainButton.onClick(handleCheckout);
        }

        function handleCheckout() {
            const address = document.getElementById("address").value.trim();
            const comment = document.getElementById("comment").value.trim();

            if (cart.length === 0) {
                tg.showAlert("Ваша корзина пуста!");
                return;
            }

            if (!address) {
                tg.showAlert("Пожалуйста, укажите адрес доставки.");
                return;
            }

            const orderData = {
                items: cart.map(i => ({
                    name: i.name,
                    size: `${i.size} cm`,
                    quantity: i.quantity,
                    price: i.price,
                    total: i.price * i.quantity
                })),
                totalSum: calculateTotal(),
                address: address,
                comment: comment
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify(orderData));
        }

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
