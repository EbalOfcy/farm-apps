<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Барбершоп Борода</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #f5f5f5);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --link-color: var(--tg-theme-link-color, #64b5f6);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #232e3c);
      --error-color: #e53935;
      --success-color: #43a047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }

    h1, h2, h3 {
      margin-bottom: 12px;
      font-weight: 600;
    }

    .header-title {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--secondary-bg-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: var(--hint-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--link-color);
      font-weight: 700;
    }

    /* Cards & Lists */
    .card {
      background-color: var(--secondary-bg-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    .service-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .service-card.selected {
      border: 1.5px solid var(--button-color);
      background-color: rgba(82, 136, 193, 0.15);
    }

    .service-info {
      flex: 1;
      padding-right: 12px;
    }

    .service-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .service-meta {
      font-size: 13px;
      color: var(--hint-color);
    }

    .btn-select {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-select.selected {
      background-color: var(--hint-color);
    }

    .summary-bar {
      background-color: var(--secondary-bg-color);
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    /* Booking Screen Controls */
    .section-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--hint-color);
      margin: 16px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .btn-chip {
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      min-width: 80px;
    }

    .btn-chip.selected {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border-color: var(--button-color);
    }

    .scroll-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px;
      margin-bottom: 12px;
      background-color: rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .slot-btn {
      background-color: var(--secondary-bg-color);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .slot-btn.selected {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border-color: var(--button-color);
    }

    .slot-btn:disabled {
      opacity: 0.35;
      text-decoration: line-through;
      cursor: not-allowed;
      background-color: transparent;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 12px;
    }

    .form-input {
      width: 100%;
      background-color: var(--secondary-bg-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--link-color);
    }

    .form-input.invalid {
      border-color: var(--error-color);
    }

    .error-text {
      color: var(--error-color);
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-text.visible {
      display: block;
    }

    /* Fallback Book button */
    .app-action-btn {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .app-action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Modal / Popups */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background-color: var(--secondary-bg-color);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .modal-content {
      font-size: 14px;
      color: var(--text-color);
      text-align: left;
      line-height: 1.5;
      margin-bottom: 20px;
      background-color: var(--bg-color);
      padding: 12px;
      border-radius: 8px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn-confirm {
      background-color: var(--button-color);
      color: var(--button-text-color);
    }

    .modal-btn-cancel {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--hint-color);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Screen 1: Services -->
    <div id="screen-services" class="screen active">
      <h2 class="header-title">Услуги барбершопа</h2>
      <div id="services-list"></div>
      <div class="summary-bar">
        <span>Итого: <span id="summary-price">0 ₽</span></span>
        <span>Время: <span id="summary-time">0 мин</span></span>
      </div>
    </div>

    <!-- Screen 2: Booking -->
    <div id="screen-booking" class="screen">
      <h2 class="header-title">Запись на стрижку</h2>

      <div class="section-label">Выберите мастера</div>
      <div class="btn-group" id="masters-list">
        <button class="btn-chip" data-master="Артём">Артём</button> <!-- #ИНТЕРАКТИВ -->
        <button class="btn-chip" data-master="Денис">Денис</button> <!-- #ИНТЕРАКТИВ -->
        <button class="btn-chip" data-master="Игорь">Игорь</button> <!-- #ИНТЕРАКТИВ -->
      </div>

      <div class="section-label">Выберите дату</div>
      <div class="btn-group" id="dates-list"></div>

      <div class="section-label">Выберите время</div>
      <div class="scroll-grid" id="slots-list"></div>

      <div class="section-label">Контактные данные</div>
      <div class="form-group">
        <input type="text" id="input-name" class="form-input" placeholder="Ваше имя"> <!-- #ИНТЕРАКТИВ #ВВОД=БУКВЫ:6 -->
      </div>

      <div class="form-group">
        <input type="tel" id="input-phone" class="form-input" placeholder="+7 (999) 000-00-00"> <!-- #ИНТЕРАКТИВ #ВВОД=ТОЧНО:+79991234567 -->
        <div id="phone-error" class="error-text">Введите корректный номер телефона (от 10 цифр)</div>
      </div>

      <div class="form-group">
        <textarea id="input-comment" class="form-input" rows="2" placeholder="Комментарий к записи"></textarea> <!-- #ИНТЕРАКТИВ #ВВОД=БУКВЫ:ЛЮБОЕ -->
      </div>

      <button id="btn-book-action" class="app-action-btn" disabled>Записаться</button> <!-- #ИНТЕРАКТИВ -->
    </div>

    <!-- Screen 3: My Bookings -->
    <div id="screen-my-bookings" class="screen">
      <h2 class="header-title">Мои записи</h2>
      <div id="my-bookings-list"></div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="services">Услуги</button> <!-- #ИНТЕРАКТИВ #ВКЛАДКА -->
    <button class="nav-btn" data-screen="booking">Запись</button> <!-- #ИНТЕРАКТИВ #ВКЛАДКА -->
    <button class="nav-btn" data-screen="my-bookings">Мои записи</button> <!-- #ИНТЕРАКТИВ #ВКЛАДКА -->
  </nav>

  <!-- Confirmation Modal -->
  <div id="modal-confirm" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Запись подтверждена!</div>
      <div id="modal-confirm-content" class="modal-content"></div>
      <button id="modal-btn-done" class="modal-btn modal-btn-confirm" style="width: 100%;">Готово</button> <!-- #ИНТЕРАКТИВ -->
    </div>
  </div>

  <!-- Cancel Confirmation Modal -->
  <div id="modal-cancel" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Отмена записи</div>
      <div class="modal-content">Вы уверены, что хотите отменить эту запись?</div>
      <div class="modal-buttons">
        <button id="modal-btn-cancel-no" class="modal-btn modal-btn-cancel">Нет</button> <!-- #ИНТЕРАКТИВ -->
        <button id="modal-btn-cancel-yes" class="modal-btn modal-btn-confirm" style="background-color: var(--error-color);">Да, отменить</button> <!-- #ИНТЕРАКТИВ -->
      </div>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function triggerHaptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Static Services Data
    const SERVICES = [
      { id: 1, title: "Мужская стрижка", price: 1500, time: 45 },
      { id: 2, title: "Стрижка машинкой", price: 900, time: 30 },
      { id: 3, title: "Оформление бороды", price: 800, time: 30 },
      { id: 4, title: "Стрижка + борода", price: 2100, time: 75 },
      { id: 5, title: "Детская стрижка", price: 1000, time: 30 },
      { id: 6, title: "Камуфляж седины", price: 1200, time: 40 }
    ];

    // State
    const state = {
      selectedServices: [],
      selectedMaster: null,
      selectedDate: null,
      selectedTime: null,
      name: "",
      phone: "",
      comment: "",
      myBookings: [],
      cancelingBookingIndex: null,
      currentScreen: "services"
    };

    // Render Services Screen
    function renderServices() {
      const container = document.getElementById('services-list');
      container.innerHTML = '';

      SERVICES.forEach(service => {
        const isSelected = state.selectedServices.some(s => s.id === service.id);
        const card = document.createElement('div');
        card.className = `card service-card ${isSelected ? 'selected' : ''}`;

        const info = document.createElement('div');
        info.className = 'service-info';
        info.innerHTML = `
          <div class="service-title">${service.title}</div>
          <div class="service-meta">${service.price} ₽ • ${service.time} мин</div>
        `;

        const btn = document.createElement('button');
        btn.className = `btn-select ${isSelected ? 'selected' : ''}`;
        btn.textContent = isSelected ? 'Выбрано' : 'Выбрать'; // #ИНТЕРАКТИВ #НАДПИСЬ=Выбрать
        btn.addEventListener('click', () => {
          triggerHaptic('selection');
          toggleService(service);
        });

        card.appendChild(info);
        card.appendChild(btn);
        container.appendChild(card);
      });

      updateSummary();
    }

    function toggleService(service) {
      const idx = state.selectedServices.findIndex(s => s.id === service.id);
      if (idx > -1) {
        state.selectedServices.splice(idx, 1);
      } else {
        state.selectedServices.push(service);
      }
      renderServices();
      checkBookingValid();
    }

    function updateSummary() {
      const totalPrice = state.selectedServices.reduce((sum, s) => sum + s.price, 0);
      const totalTime = state.selectedServices.reduce((sum, s) => sum + s.time, 0);
      document.getElementById('summary-price').textContent = `${totalPrice} ₽`;
      document.getElementById('summary-time').textContent = `${totalTime} мин`;
    }

    // Render Next 7 Days
    function renderDates() {
      const container = document.getElementById('dates-list');
      container.innerHTML = '';
      const today = new Date();

      for (let i = 0; i < 7; i++) {
        const dateObj = new Date(today);
        dateObj.setDate(today.getDate() + i);

        const dayNum = dateObj.getDate();
        const monthNum = ('0' + (dateObj.getMonth() + 1)).slice(-2);
        const dateString = `${dayNum}.${monthNum}`;

        const btn = document.createElement('button');
        btn.className = 'btn-chip';
        btn.textContent = dateString; // #ИНТЕРАКТИВ #НАДПИСЬ=03.10
        if (state.selectedDate === dateString) {
          btn.classList.add('selected');
        }

        btn.addEventListener('click', () => {
          triggerHaptic('selection');
          state.selectedDate = dateString;
          document.querySelectorAll('#dates-list .btn-chip').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          renderSlots();
          checkBookingValid();
        });

        container.appendChild(btn);
      }
    }

    // Render Time Slots (10:00 to 20:00 every 30 mins)
    function renderSlots() {
      const container = document.getElementById('slots-list');
      container.innerHTML = '';

      const bookedSlots = ['11:30', '13:00', '15:30', '17:00'];
      const times = [];
      for (let h = 10; h <= 20; h++) {
        const hourStr = ('0' + h).slice(-2);
        times.push(`${hourStr}:00`);
        if (h < 20) {
          times.push(`${hourStr}:30`);
        }
      }

      times.forEach(time => {
        const btn = document.createElement('button');
        btn.className = 'slot-btn';
        btn.textContent = time; // #ИНТЕРАКТИВ #НАДПИСЬ=10:00 #ОКНО

        const isBooked = bookedSlots.includes(time);
        if (isBooked) {
          btn.disabled = true;
        } else {
          if (state.selectedTime === time) {
            btn.classList.add('selected');
          }
          btn.addEventListener('click', () => {
            triggerHaptic('selection');
            state.selectedTime = time;
            document.querySelectorAll('#slots-list .slot-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            checkBookingValid();
          });
        }
        container.appendChild(btn);
      });
    }

    // Phone validation
    function validatePhone(phone) {
      const cleanDigits = phone.replace(/\D/g, '');
      return cleanDigits.length >= 10 && cleanDigits.length <= 15;
    }

    function checkBookingValid() {
      const isServiceSelected = state.selectedServices.length > 0;
      const isMasterSelected = !!state.selectedMaster;
      const isDateSelected = !!state.selectedDate;
      const isTimeSelected = !!state.selectedTime;
      const isNameValid = state.name.trim().length > 0;
      const isPhoneValid = validatePhone(state.phone);

      const isValid = isServiceSelected && isMasterSelected && isDateSelected && isTimeSelected && isNameValid && isPhoneValid;

      const actionBtn = document.getElementById('btn-book-action');
      actionBtn.disabled = !isValid;

      if (tg?.MainButton) {
        if (state.currentScreen === 'booking') {
          tg.MainButton.setText('ЗАПИСАТЬСЯ');
          if (isValid) {
            tg.MainButton.enable();
            tg.MainButton.show();
          } else {
            tg.MainButton.disable();
            tg.MainButton.show();
          }
        } else {
          tg.MainButton.hide();
        }
      }

      return isValid;
    }

    // Switch Screens
    function switchScreen(screenName) {
      triggerHaptic('impact');
      state.currentScreen = screenName;

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const activeScreenEl = document.getElementById(`screen-${screenName}`);
      if (activeScreenEl) activeScreenEl.classList.add('active');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.screen === screenName);
      });

      if (tg?.BackButton) {
        if (screenName === 'booking' || screenName === 'my-bookings') {
          tg.BackButton.show();
        } else {
          tg.BackButton.hide();
        }
      }

      if (screenName === 'my-bookings') {
        renderMyBookings();
      }

      checkBookingValid();
    }

    // Booking Submission & Confirmation
    function performBooking() {
      if (!checkBookingValid()) return;

      const bookingRecord = {
        id: Date.now(),
        services: [...state.selectedServices],
        master: state.selectedMaster,
        date: state.selectedDate,
        time: state.selectedTime,
        name: state.name.trim(),
        phone: state.phone.trim(),
        comment: state.comment.trim(),
        totalPrice: state.selectedServices.reduce((sum, s) => sum + s.price, 0),
        totalTime: state.selectedServices.reduce((sum, s) => sum + s.time, 0)
      };

      state.myBookings.unshift(bookingRecord);

      // Fill Confirmation Modal
      const modalContent = document.getElementById('modal-confirm-content');
      modalContent.innerHTML = `
        <strong>Имя:</strong> ${bookingRecord.name}<br>
        <strong>Телефон:</strong> ${bookingRecord.phone}<br>
        <strong>Мастер:</strong> ${bookingRecord.master}<br>
        <strong>Дата и время:</strong> ${bookingRecord.date} в ${bookingRecord.time}<br>
        <strong>Услуги:</strong> ${bookingRecord.services.map(s => s.title).join(', ')}<br>
        <strong>Итого:</strong> ${bookingRecord.totalPrice} ₽ (${bookingRecord.totalTime} мин)
        ${bookingRecord.comment ? `<br><strong>Комментарий:</strong> ${bookingRecord.comment}` : ''}
      `;

      triggerHaptic('success');
      document.getElementById('modal-confirm').classList.add('active');

      if (tg) {
        try {
          tg.sendData(JSON.stringify(bookingRecord));
        } catch (e) {
          console.warn('sendData unavailable', e);
        }
      }
    }

    // Render "My Bookings"
    function renderMyBookings() {
      const container = document.getElementById('my-bookings-list');
      container.innerHTML = '';

      if (state.myBookings.length === 0) {
        container.innerHTML = '<div class="empty-state">У вас пока нет активных записей</div>';
        return;
      }

      state.myBookings.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="font-weight: 600; margin-bottom: 6px; font-size: 15px;">
            ${item.services.map(s => s.title).join(', ')}
          </div>
          <div style="font-size: 13px; color: var(--hint-color); margin-bottom: 10px; line-height: 1.4;">
            Мастер: <strong>${item.master}</strong><br>
            Дата: <strong>${item.date} в ${item.time}</strong><br>
            Стоимость: <strong>${item.totalPrice} ₽</strong>
          </div>
        `;

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn-select';
        cancelBtn.style.backgroundColor = 'var(--error-color)';
        cancelBtn.textContent = 'Отменить'; // #ИНТЕРАКТИВ #НАДПИСЬ=Отменить
        cancelBtn.addEventListener('click', () => {
          triggerHaptic('warning');
          state.cancelingBookingIndex = index;
          document.getElementById('modal-cancel').classList.add('active');
        });

        card.appendChild(cancelBtn);
        container.appendChild(card);
      });
    }

    // Event Listeners Setup
    document.addEventListener('DOMContentLoaded', () => {
      renderServices();
      renderDates();
      renderSlots();

      // Navigation bar click
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchScreen(btn.dataset.screen);
        });
      });

      // Master selection
      document.querySelectorAll('#masters-list .btn-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          triggerHaptic('selection');
          state.selectedMaster = btn.dataset.master;
          document.querySelectorAll('#masters-list .btn-chip').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          checkBookingValid();
        });
      });

      // Name input
      const nameInput = document.getElementById('input-name');
      nameInput.addEventListener('input', (e) => {
        state.name = e.target.value;
        checkBookingValid();
      });

      // Phone input & validation
      const phoneInput = document.getElementById('input-phone');
      const phoneError = document.getElementById('phone-error');
      phoneInput.addEventListener('input', (e) => {
        state.phone = e.target.value;
        const valid = validatePhone(state.phone);
        if (state.phone.trim().length > 0 && !valid) {
          phoneInput.classList.add('invalid');
          phoneError.classList.add('visible');
        } else {
          phoneInput.classList.remove('invalid');
          phoneError.classList.remove('visible');
        }
        checkBookingValid();
      });

      // Comment input
      const commentInput = document.getElementById('input-comment');
      commentInput.addEventListener('input', (e) => {
        state.comment = e.target.value;
      });

      // Booking Action Button
      document.getElementById('btn-book-action').addEventListener('click', performBooking);

      // Telegram MainButton & BackButton binding
      if (tg) {
        tg.MainButton.onClick(() => {
          if (state.currentScreen === 'booking') {
            performBooking();
          }
        });

        tg.BackButton.onClick(() => {
          switchScreen('services');
        });
      }

      // Confirmation Modal "Done" button
      document.getElementById('modal-btn-done').addEventListener('click', () => {
        triggerHaptic('light');
        document.getElementById('modal-confirm').classList.remove('active');
        // Reset booking form
        state.selectedServices = [];
        state.selectedMaster = null;
        state.selectedDate = null;
        state.selectedTime = null;
        state.name = '';
        state.phone = '';
        state.comment = '';

        nameInput.value = '';
        phoneInput.value = '';
        commentInput.value = '';
        document.querySelectorAll('.btn-chip').forEach(b => b.classList.remove('selected'));
        document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));

        renderServices();
        renderDates();
        renderSlots();
        switchScreen('my-bookings');
      });

      // Cancellation Modal buttons
      document.getElementById('modal-btn-cancel-no').addEventListener('click', () => {
        triggerHaptic('light');
        state.cancelingBookingIndex = null;
        document.getElementById('modal-cancel').classList.remove('active');
      });

      document.getElementById('modal-btn-cancel-yes').addEventListener('click', () => {
        triggerHaptic('warning');
        if (state.cancelingBookingIndex !== null && state.cancelingBookingIndex >= 0) {
          state.myBookings.splice(state.cancelingBookingIndex, 1);
          state.cancelingBookingIndex = null;
        }
        document.getElementById('modal-cancel').classList.remove('active');
        renderMyBookings();
      });
    });
  </script>
</body>
</html>
