<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pizzeria Forno</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #FFF8F0);
      --text-color: var(--tg-theme-text-color, #2C1A1D);
      --hint-color: var(--tg-theme-hint-color, #8C7B70);
      --link-color: var(--tg-theme-link-color, #8B0000);
      --button-color: var(--tg-theme-button-color, #8B0000);
      --button-text-color: var(--tg-theme-button-text-color, #FFFFFF);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #F5EBE6);
      
      --brand-dark-red: #7A0000;
      --brand-cream: #FFF8F0;
      --brand-cream-card: #FAF0E6;
      --border-radius: 14px;
      --font-size-base: 17px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size-base);
      line-height: 1.4;
      padding-bottom: 30px;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding: 16px 0 24px;
      border-bottom: 2px dashed var(--brand-dark-red);
      margin-bottom: 20px;
    }

    .header-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      display: block;
    }

    .header h1 {
      font-size: 28px;
      color: var(--brand-dark-red);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 15px;
      color: var(--hint-color);
      margin-top: 4px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-dark-red);
      margin: 24px 0 16px;
    }

    .pizza-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pizza-card {
      background-color: var(--secondary-bg-color);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(122, 0, 0, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .pizza-header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pizza-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .pizza-info {
      flex-grow: 1;
    }

    .pizza-title {
      font-size: 19px;
      font-weight: 700;
    }

    .pizza-desc {
      font-size: 14px;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .size-selector {
      display: flex;
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .size-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .size-btn.active {
      background-color: var(--brand-dark-red);
      color: var(--brand-cream);
    }

    .pizza-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .pizza-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-dark-red);
    }

    .add-btn {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
    }

    .cart-section {
      background-color: var(--secondary-bg-color);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-top: 16px;
      border: 1px solid rgba(122, 0, 0, 0.1);
    }

    .cart-empty {
      text-align: center;
      color: var(--hint-color);
      padding: 16px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed var(--hint-color);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 17px;
      font-weight: 700;
    }

    .cart-item-meta {
      font-size: 14px;
      color: var(--hint-color);
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      background-color: var(--brand-dark-red);
      color: var(--brand-cream);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cart-qty {
      font-weight: 700;
      font-size: 16px;
      min-width: 20px;
      text-align: center;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--brand-dark-red);
      font-size: 20px;
      font-weight: bold;
      padding: 0 8px;
      cursor: pointer;
      margin-left: 8px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px solid var(--brand-dark-red);
    }

    .form-group {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--hint-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--brand-dark-red);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 70px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <svg class="header-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4L6 58H58L32 4Z" fill="#7A0000"/>
        <circle cx="32" cy="24" r="4" fill="#FFF8F0"/>
        <circle cx="24" cy="38" r="3.5" fill="#FFF8F0"/>
        <circle cx="40" cy="38" r="3.5" fill="#FFF8F0"/>
        <circle cx="32" cy="48" r="3" fill="#FFF8F0"/>
      </svg>
      <h1>Pizzeria Forno</h1>
      <p>Традиционная семейная пиццерия</p>
    </header>

    <main>
      <h2 class="section-title">Меню Пиццы</h2>
      <div id="pizza-list" class="pizza-list"></div>

      <h2 class="section-title">Ваш Заказ</h2>
      <div class="cart-section">
        <div id="cart-items">
          <div class="cart-empty">Корзина пуста</div>
        </div>
        <div id="cart-summary" class="cart-total" style="display: none;">
          <span>Итого:</span>
          <span id="cart-total-amount">0 ₽</span>
        </div>
      </div>

      <h2 class="section-title">Детали Доставки</h2>
      <div class="form-group">
        <label class="form-label" for="address-input">Адрес доставки *</label>
        <textarea id="address-input" class="form-input" placeholder="Укажите улицу, дом, подъезд, квартиру"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="comment-input">Комментарий курьеру</label>
        <input type="text" id="comment-input" class="form-input" placeholder="Код домофона, этаж, пожелания">
      </div>
    </main>
  </div>

  <script>
    /**
     * Logger utility for tracing application behavior and potential execution errors.
     */
    const Logger = {
      log: (msg, data = null) => console.log(`[FORNO_LOG] ${msg}`, data || ''),
      error: (msg, err = null) => console.error(`[FORNO_ERROR] ${msg}`, err || '')
    };

    /**
     * Initial Dataset representing available pizzas in Pizzeria Forno.
     */
    const PIZZA_DATA = [
      {
        id: 'margherita',
        name: 'Маргарита',
        description: 'Томатный соус, моцарелла, свежий базилик, оливковое масло',
        basePrice: 450,
        selectedSize: 25
      },
      {
        id: 'pepperoni',
        name: 'Пепперони',
        description: 'Томатный соус, моцарелла, пикантная пепперони, орегано',
        basePrice: 550,
        selectedSize: 25
      },
      {
        id: 'quattro-formaggi',
        name: 'Четыре Сыра',
        description: 'Сливочный соус, моцарелла, горгонзола, пармезан, проволоне',
        basePrice: 620,
        selectedSize: 25
      },
      {
        id: 'capricciosa',
        name: 'Капричоза',
        description: 'Томатный соус, моцарелла, ветчина, шампиньоны, артишоки, оливки',
        basePrice: 580,
        selectedSize: 25
      },
      {
        id: 'diablo',
        name: 'Дьябло',
        description: 'Острый томатный соус, моцарелла, салями, халапеньо, перец чили',
        basePrice: 590,
        selectedSize: 25
      },
      {
        id: 'prosciutto-funghi',
        name: 'Прошутто э Фунги',
        description: 'Томатный соус, моцарелла, прошутто котто, свежие шампиньоны',
        basePrice: 560,
        selectedSize: 25
      },
      {
        id: 'bbq-chicken',
        name: 'Цыпленок Барбекю',
        description: 'Соус BBQ, моцарелла, филе цыпленка, красный лук, кинза',
        basePrice: 570,
        selectedSize: 25
      },
      {
        id: 'vegana',
        name: 'Вегана',
        description: 'Томатный соус, веганская моцарелла, болгарский перец, цукини, рукола',
        basePrice: 520,
        selectedSize: 25
      }
    ];

    /**
     * Application State Manager.
     */
    class Store {
      constructor(pizzas) {
        this.pizzas = pizzas.map(p => ({ ...p }));
        this.cart = [];
        this.address = '';
        this.comment = '';
      }

      setSize(pizzaId, size) {
        const pizza = this.pizzas.find(p => p.id === pizzaId);
        if (pizza) {
          pizza.selectedSize = size;
          Logger.log(`Updated size for ${pizzaId} to ${size}`);
        }
      }

      addToCart(pizzaId) {
        const pizza = this.pizzas.find(p => p.id === pizzaId);
        if (!pizza) return;

        const size = pizza.selectedSize;
        const price = size === 35 ? pizza.basePrice + 250 : pizza.basePrice;

        const existingItem = this.cart.find(item => item.id === pizzaId && item.size === size);
        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          this.cart.push({
            id: pizza.id,
            name: pizza.name,
            size: size,
            price: price,
            quantity: 1
          });
        }
        Logger.log(`Cart updated, total items: ${this.cart.length}`);
      }

      updateQuantity(pizzaId, size, delta) {
        const item = this.cart.find(i => i.id === pizzaId && i.size === size);
        if (item) {
          item.quantity += delta;
          if (item.quantity <= 0) {
            this.removeFromCart(pizzaId, size);
          }
        }
      }

      removeFromCart(pizzaId, size) {
        this.cart = this.cart.filter(item => !(item.id === pizzaId && item.size === size));
        Logger.log(`Removed ${pizzaId} (${size}cm) from cart`);
      }

      getTotalPrice() {
        return this.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
      }

      isValidOrder() {
        return this.cart.length > 0 && this.address.trim().length > 0;
      }
    }

    const appStore = new Store(PIZZA_DATA);
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    /**
     * UI Renderer and Event Manager.
     */
    function initApp() {
      try {
        if (tg) {
          tg.ready();
          tg.expand();
          Logger.log("Telegram WebApp initialized");
        }
      } catch (e) {
        Logger.error("Failed to initialize Telegram WebApp API", e);
      }

      renderMenu();
      renderCart();
      setupInputListeners();
      updateMainButton();
    }

    function triggerHaptic() {
      if (tg && tg.HapticFeedback) {
        try {
          tg.HapticFeedback.impactOccurred('light');
        } catch (e) {
          Logger.error("Haptic feedback invocation error", e);
        }
      }
    }

    function renderMenu() {
      const container = document.getElementById('pizza-list');
      container.innerHTML = '';

      appStore.pizzas.forEach(pizza => {
        const currentPrice = pizza.selectedSize === 35 ? pizza.basePrice + 250 : pizza.basePrice;

        const card = document.createElement('div');
        card.className = 'pizza-card';

        const svgPizzaIcon = `
          <svg class="pizza-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="30" fill="#7A0000"/>
            <circle cx="32" cy="32" r="24" fill="#FFF8F0"/>
            <circle cx="26" cy="22" r="4" fill="#7A0000"/>
            <circle cx="40" cy="28" r="4" fill="#7A0000"/>
            <circle cx="24" cy="40" r="4" fill="#7A0000"/>
            <circle cx="38" cy="42" r="4" fill="#7A0000"/>
          </svg>
        `;

        card.innerHTML = `
          <div class="pizza-header">
            ${svgPizzaIcon}
            <div class="pizza-info">
              <div class="pizza-title">${pizza.name}</div>
              <div class="pizza-desc">${pizza.description}</div>
            </div>
          </div>
          <div class="size-selector">
            <button class="size-btn ${pizza.selectedSize === 25 ? 'active' : ''}" data-id="${pizza.id}" data-size="25">25 см</button> <!-- #ИНТЕРАКТИВ -->
            <button class="size-btn ${pizza.selectedSize === 35 ? 'active' : ''}" data-id="${pizza.id}" data-size="35">35 см (+250 ₽)</button> <!-- #ИНТЕРАКТИВ -->
          </div>
          <div class="pizza-footer">
            <div class="pizza-price">${currentPrice} ₽</div>
            <button class="add-btn" data-id="${pizza.id}">Добавить</button> <!-- #ИНТЕРАКТИВ -->
          </div>
        `;

        // Size toggle binding
        const sizeBtns = card.querySelectorAll('.size-btn');
        sizeBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            triggerHaptic();
            const id = e.target.getAttribute('data-id');
            const size = parseInt(e.target.getAttribute('data-size'), 10);
            appStore.setSize(id, size);
            renderMenu();
          });
        });

        // Add to cart binding
        const addBtn = card.querySelector('.add-btn');
        addBtn.addEventListener('click', () => {
          triggerHaptic();
          appStore.addToCart(pizza.id);
          renderCart();
          updateMainButton();
        });

        container.appendChild(card);
      });
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const summaryBox = document.getElementById('cart-summary');
      const totalAmountEl = document.getElementById('cart-total-amount');

      if (appStore.cart.length === 0) {
        container.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
        summaryBox.style.display = 'none';
        return;
      }

      container.innerHTML = '';
      summaryBox.style.display = 'flex';

      appStore.cart.forEach(item => {
        const itemRow = document.createElement('div');
        itemRow.className = 'cart-item';

        itemRow.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-meta">${item.size} см • ${item.price} ₽</div>
          </div>
          <div class="cart-controls">
            <button class="qty-btn btn-minus" data-id="${item.id}" data-size="${item.size}">-</button> <!-- #ИНТЕРАКТИВ -->
            <span class="cart-qty">${item.quantity}</span>
            <button class="qty-btn btn-plus" data-id="${item.id}" data-size="${item.size}">+</button> <!-- #ИНТЕРАКТИВ -->
            <button class="remove-btn" data-id="${item.id}" data-size="${item.size}">✕</button> <!-- #ИНТЕРАКТИВ -->
          </div>
        `;

        itemRow.querySelector('.btn-minus').addEventListener('click', () => {
          triggerHaptic();
          appStore.updateQuantity(item.id, item.size, -1);
          renderCart();
          updateMainButton();
        });

        itemRow.querySelector('.btn-plus').addEventListener('click', () => {
          triggerHaptic();
          appStore.updateQuantity(item.id, item.size, 1);
          renderCart();
          updateMainButton();
        });

        itemRow.querySelector('.remove-btn').addEventListener('click', () => {
          triggerHaptic();
          appStore.removeFromCart(item.id, item.size);
          renderCart();
          updateMainButton();
        });

        container.appendChild(itemRow);
      });

      totalAmountEl.textContent = `${appStore.getTotalPrice()} ₽`;
    }

    function setupInputListeners() {
      const addressInput = document.getElementById('address-input');
      const commentInput = document.getElementById('comment-input');

      addressInput.addEventListener('input', (e) => {
        appStore.address = e.target.value;
        updateMainButton();
      });

      commentInput.addEventListener('input', (e) => {
        appStore.comment = e.target.value;
      });
    }

    function updateMainButton() {
      if (!tg || !tg.MainButton) return;

      const totalPrice = appStore.getTotalPrice();
      const isValid = appStore.isValidOrder();

      if (appStore.cart.length === 0) {
        tg.MainButton.setText('ДОБАВЬТЕ ПИЦЦУ В КОРЗИНУ');
        tg.MainButton.hide();
        return;
      }

      tg.MainButton.show();

      if (!appStore.address.trim()) {
        tg.MainButton.setText(`УКАЖИТЕ АДРЕС (${totalPrice} ₽)`);
        tg.MainButton.disable();
        tg.MainButton.setParams({
          color: '#8C7B70',
          text_color: '#FFFFFF'
        });
      } else {
        tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ • ${totalPrice} ₽`);
        tg.MainButton.enable();
        tg.MainButton.setParams({
          color: '#7A0000',
          text_color: '#FFFFFF'
        });
      }
    }

    function handleOrderSubmit() {
      if (!appStore.isValidOrder()) return;

      const orderPayload = {
        items: appStore.cart.map(item => ({
          name: item.name,
          size: `${item.size} см`,
          quantity: item.quantity,
          price: item.price,
          subtotal: item.price * item.quantity
        })),
        total: appStore.getTotalPrice(),
        address: appStore.address.trim(),
        comment: appStore.comment.trim(),
        timestamp: new Date().toISOString()
      };

      Logger.log("Submitting order via Telegram.sendData", orderPayload);

      try {
        if (tg) {
          tg.sendData(JSON.stringify(orderPayload));
        } else {
          alert("Заказ сформирован (вне Telegram): " + JSON.stringify(orderPayload, null, 2));
        }
      } catch (e) {
        Logger.error("Failed to send order data", e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      if (tg && tg.MainButton) {
        tg.MainButton.onClick(() => {
          triggerHaptic();
          handleOrderSubmit();
        });
      }
    });
  </script>
</body>
</html>
