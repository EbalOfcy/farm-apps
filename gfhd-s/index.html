<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Семейная пиццерия Forno</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #FDFBF7);
      --text-color: var(--tg-theme-text-color, #222222);
      --sec-bg-color: var(--tg-theme-secondary-bg-color, #F4EFE6);
      --hint-color: var(--tg-theme-hint-color, #7F7F7F);
      --button-color: var(--tg-theme-button-color, #8B0000);
      --button-text-color: var(--tg-theme-button-text-color, #FFFFFF);
      --brand-red: #8B0000;
      --border-color: rgba(139, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: 90px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px dashed var(--brand-red);
    }

    .header-logo {
      width: 56px;
      height: 56px;
      fill: var(--brand-red);
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--brand-red);
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 24px 0 12px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pizza-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pizza-card {
      background-color: var(--sec-bg-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .pizza-header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pizza-icon {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .pizza-info {
      flex-grow: 1;
    }

    .pizza-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pizza-desc {
      font-size: 14px;
      color: var(--hint-color);
    }

    .pizza-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 8px;
    }

    .size-toggle {
      display: flex;
      flex: 1;
      gap: 4px;
    }

    .size-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .size-btn.active {
      background-color: var(--brand-red);
      color: #FFFFFF;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .price-display {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-color);
    }

    .add-btn {
      background-color: var(--brand-red);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-container {
      background-color: var(--sec-bg-color);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .cart-empty {
      text-align: center;
      color: var(--hint-color);
      padding: 16px 0;
      font-size: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-weight: 700;
      font-size: 16px;
    }

    .cart-item-sub {
      font-size: 13px;
      color: var(--hint-color);
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-text {
      font-weight: 700;
      font-size: 15px;
      min-width: 16px;
      text-align: center;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--brand-red);
      font-size: 18px;
      cursor: pointer;
      padding: 0 6px;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px dashed var(--border-color);
    }

    .form-group {
      margin-top: 14px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;

    }

    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--sec-bg-color);
      color: var(--text-color);
      font-size: 15px;
      font-family: inherit;
    }

    .form-control:focus {
      outline: 2px solid var(--brand-red);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="header-logo" viewBox="0 0 24 24">
        <path d="M12 2L2 19h20L12 2zm0 3.8L18.5 17H5.5L12 5.8zM12 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-2 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm4 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
      </svg>
      <h1>Forno</h1>
      <p>Семейная пиццерия • Традиционные рецепты</p>
    </div>

    <div class="section-title">Меню пиццы</div>
    <div id="pizza-list" class="pizza-list"></div>

    <div class="section-title">Ваш заказ</div>
    <div class="cart-container">
      <div id="cart-items"></div>
      <div class="cart-summary">
        <span>Итого:</span>
        <span id="cart-total">0 ₽</span>
      </div>
    </div>

    <div class="section-title">Детали доставки</div>
    <div class="form-group">
      <label for="address-input">Адрес доставки *</label>
      <input type="text" id="address-input" class="form-control" placeholder="Улица, дом, квартира">
    </div>

    <div class="form-group">
      <label for="comment-input">Комментарий курьеру</label>
      <textarea id="comment-input" class="form-control" placeholder="Код домофона, подъезд, этаж..."></textarea>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const PIZZAS = [
      { id: 1, name: "Маргарита", desc: "Свежая моцарелла, томаты, базилик, оливковое масло", price: 450 },
      { id: 2, name: "Пепперони", desc: "Острая пепперони, моцарелла, фирменный томатный соус", price: 550 },
      { id: 3, name: "Четыре Сыра", desc: "Моцарелла, горгонзола, пармезан, проволоне", price: 620 },
      { id: 4, name: "Капричоза", desc: "Ветчина, шампиньоны, артишоки, оливки, моцарелла", price: 580 },
      { id: 5, name: "Прошутто и Фунги", desc: "Итальянская ветчина прошутто, лесные грибы, моцарелла", price: 590 },
      { id: 6, name: "Дьявола", desc: "Острая салями, перец чили, красный лук, моцарелла", price: 560 },
      { id: 7, name: "Маринара", desc: "Томаты, чеснок, орегано, оливковое масло Extra Virgin", price: 400 },
      { id: 8, name: "Вегетарианская", desc: "Болгарский перец, цукини, баклажаны, томаты черри", price: 510 }
    ];

    const LARGE_SIZE_SURCHARGE = 250;
    let selectedSizes = {};
    let cart = {};

    PIZZAS.forEach(p => {
      selectedSizes[p.id] = 25;
    });

    const pizzaListEl = document.getElementById('pizza-list');
    const cartItemsEl = document.getElementById('cart-items');
    const cartTotalEl = document.getElementById('cart-total');
    const addressInput = document.getElementById('address-input');
    const commentInput = document.getElementById('comment-input');

    function renderPizzaSvg() {
      return `<svg class="pizza-icon" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#E28743"/>
        <circle cx="32" cy="32" r="25" fill="#F4A261"/>
        <circle cx="32" cy="32" r="22" fill="#E76F51"/>
        <circle cx="24" cy="20" r="4" fill="#A8201A"/>
        <circle cx="42" cy="26" r="4" fill="#A8201A"/>
        <circle cx="22" cy="38" r="4" fill="#A8201A"/>
        <circle cx="38" cy="42" r="4" fill="#A8201A"/>
        <circle cx="32" cy="30" r="3" fill="#2A9D8F"/>
      </svg>`;
    }

    function renderMenu() {
      pizzaListEl.innerHTML = '';
      PIZZAS.forEach(pizza => {
        const currentSize = selectedSizes[pizza.id];
        const currentPrice = pizza.price + (currentSize === 35 ? LARGE_SIZE_SURCHARGE : 0);

        const card = document.createElement('div');
        card.className = 'pizza-card';

        const header = document.createElement('div');
        header.className = 'pizza-header';
        header.innerHTML = `${renderPizzaSvg()}<div class="pizza-info"><div class="pizza-title">${pizza.name}</div><div class="pizza-desc">${pizza.desc}</div></div>`;

        const options = document.createElement('div');
        options.className = 'pizza-options';

        const sizeToggle = document.createElement('div');
        sizeToggle.className = 'size-toggle';

        const btn25 = document.createElement('button'); // #ИНТЕРАКТИВ
        btn25.className = `size-btn ${currentSize === 25 ? 'active' : ''}`;
        btn25.innerText = '25 см';
        btn25.addEventListener('click', () => {
          selectedSizes[pizza.id] = 25;
          renderMenu();
        });

        const btn35 = document.createElement('button'); // #ИНТЕРАКТИВ
        btn35.className = `size-btn ${currentSize === 35 ? 'active' : ''}`;
        btn35.innerText = '35 см';
        btn35.addEventListener('click', () => {
          selectedSizes[pizza.id] = 35;
          renderMenu();
        });

        sizeToggle.appendChild(btn25);
        sizeToggle.appendChild(btn35);
        options.appendChild(sizeToggle);

        const actionRow = document.createElement('div');
        actionRow.className = 'action-row';

        const priceEl = document.createElement('div');
        priceEl.className = 'price-display';
        priceEl.innerText = `${currentPrice} ₽`;

        const addBtn = document.createElement('button'); // #ИНТЕРАКТИВ
        addBtn.className = 'add-btn';
        addBtn.innerText = 'Добавить';
        addBtn.addEventListener('click', () => {
          addToCart(pizza.id, currentSize, currentPrice);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        actionRow.appendChild(priceEl);
        actionRow.appendChild(addBtn);

        card.appendChild(header);
        card.appendChild(options);
        card.appendChild(actionRow);

        pizzaListEl.appendChild(card);
      });
    }

    function addToCart(pizzaId, size, price) {
      const key = `${pizzaId}_${size}`;
      const pizza = PIZZAS.find(p => p.id === pizzaId);
      if (cart[key]) {
        cart[key].quantity += 1;
      } else {
        cart[key] = {
          id: pizzaId,
          name: pizza.name,
          size: size,
          price: price,
          quantity: 1
        };
      }
      renderCart();
    }

    function updateQuantity(key, delta) {
      if (!cart[key]) return;
      cart[key].quantity += delta;
      if (cart[key].quantity <= 0) {
        delete cart[key];
      }
      renderCart();
    }

    function removeFromCart(key) {
      delete cart[key];
      renderCart();
    }

    function calculateTotal() {
      return Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    function renderCart() {
      cartItemsEl.innerHTML = '';
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartItemsEl.innerHTML = '<div class="cart-empty">Ваша корзина пуста</div>';
        cartTotalEl.innerText = '0 ₽';
        updateMainButton();
        return;
      }

      keys.forEach(key => {
        const item = cart[key];
        const itemEl = document.createElement('div');
        itemEl.className = 'cart-item';

        const info = document.createElement('div');
        info.className = 'cart-item-info';
        info.innerHTML = `<div class="cart-item-name">${item.name}</div><div class="cart-item-sub">${item.size} см • ${item.price} ₽</div>`;

        const actions = document.createElement('div');
        actions.className = 'cart-item-actions';

        const decBtn = document.createElement('button'); // #ИНТЕРАКТИВ
        decBtn.className = 'qty-btn';
        decBtn.innerText = '-';
        decBtn.addEventListener('click', () => {
          updateQuantity(key, -1);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        const qtyText = document.createElement('span');
        qtyText.className = 'qty-text';
        qtyText.innerText = item.quantity;

        const incBtn = document.createElement('button'); // #ИНТЕРАКТИВ
        incBtn.className = 'qty-btn';
        incBtn.innerText = '+';
        incBtn.addEventListener('click', () => {
          updateQuantity(key, 1);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        const removeBtn = document.createElement('button'); // #ИНТЕРАКТИВ
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '&#10005;';
        removeBtn.addEventListener('click', () => {
          removeFromCart(key);
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        actions.appendChild(decBtn);
        actions.appendChild(qtyText);
        actions.appendChild(incBtn);
        actions.appendChild(removeBtn);

        itemEl.appendChild(info);
        itemEl.appendChild(actions);

        cartItemsEl.appendChild(itemEl);
      });

      const total = calculateTotal();
      cartTotalEl.innerText = `${total} ₽`;
      updateMainButton();
    }

    function updateMainButton() {
      const total = calculateTotal();
      if (total > 0) {
        tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ • ${total} ₽`);
        tg.MainButton.show();
      } else {
        tg.MainButton.setText('ОФОРМИТЬ ЗАКАЗ');
        tg.MainButton.show();
      }
    }

    function handleOrderPlacement() {
      const total = calculateTotal();
      const address = addressInput.value.trim();
      const comment = commentInput.value.trim();

      if (Object.keys(cart).length === 0) {
        tg.showAlert('Пожалуйста, добавьте хотя бы одну пиццу в корзину.');
        return;
      }

      if (!address) {
        tg.showAlert('Укажите адрес доставки для оформления заказа.');
        addressInput.focus();
        return;
      }

      const orderPayload = {
        items: Object.values(cart).map(i => ({
          name: i.name,
          size: i.size,
          quantity: i.quantity,
          price: i.price,
          total: i.price * i.quantity
        })),
        total_amount: total,
        delivery_address: address,
        courier_comment: comment
      };

      tg.sendData(JSON.stringify(orderPayload));
    }

    tg.MainButton.onClick(handleOrderPlacement); // #ИНТЕРАКТИВ

    renderMenu();
    renderCart();
  </script>
</body>
</html>
