<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizzeria Forno</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #FFFDD0);
      --text-color: var(--tg-theme-text-color, #2B1810);
      --hint-color: var(--tg-theme-hint-color, #7F6A5D);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #F4EAD3);
      --primary-red: #8B0000;
      --accent-cream: #FFFDD0;
      --border-color: rgba(139, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 18px;
      line-height: 1.4;
      padding-bottom: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-red);
    }

    .logo {
      width: 64px;
      height: 64px;
      fill: var(--primary-red);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      color: var(--primary-red);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--hint-color);
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .pizza-card {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .pizza-header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pizza-icon {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    .pizza-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-red);
    }

    .pizza-desc {
      font-size: 15px;
      color: var(--hint-color);
    }

    .size-selector {
      display: flex;
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }

    .size-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .size-btn.active {
      background-color: var(--primary-red);
      color: var(--accent-cream);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .price {
      font-size: 20px;
      font-weight: 700;
    }

    .add-btn {
      background-color: var(--primary-red);
      color: var(--accent-cream);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-section {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-red);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-empty {
      text-align: center;
      color: var(--hint-color);
      padding: 12px 0;
      font-size: 16px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 16px;
      font-weight: 700;
    }

    .cart-item-sub {
      font-size: 14px;
      color: var(--hint-color);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-btn {
      background-color: var(--primary-red);
      color: var(--accent-cream);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .quantity {
      font-size: 16px;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
    }

    .form-section {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 15px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary-red);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg class="logo" viewBox="0 0 24 24">
        <path d="M12 2C8.43 2 5.23 3.54 3.01 6L12 22L20.99 6C18.77 3.54 15.57 2 12 2ZM7 7C7.83 7 8.5 7.67 8.5 8.5C8.5 9.33 7.83 10 7 10C6.17 10 5.5 9.33 5.5 8.5C5.5 7.67 6.17 7 7 7ZM11.5 13.5C10.67 13.5 10 12.83 10 12C10 11.17 10.67 10.5 11.5 10.5C12.33 10.5 13 11.17 13 12C13 12.83 12.33 13.5 11.5 13.5ZM14.5 9C13.67 9 13 8.33 13 7.5C13 6.67 13.67 6 14.5 6C15.33 6 16 6.67 16 7.5C16 8.33 15.33 9 14.5 9Z"/>
      </svg>
      <h1>FORNO</h1>
      <div class="subtitle">Family Pizzeria</div>
    </header>

    <main>
      <div class="menu-list" id="menu-list"></div>

      <div class="cart-section">
        <div class="section-title">Your Order</div>
        <div id="cart-content">
          <div class="cart-empty">Cart is empty</div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Delivery Details</div>
        <div class="input-group">
          <label for="address">Delivery Address *</label>
          <input type="text" id="address" placeholder="Street, house, entrance, floor, apt">
        </div>
        <div class="input-group">
          <label for="comment">Courier Comment</label>
          <textarea id="comment" rows="2" placeholder="Intercom code, door instructions, etc."></textarea>
        </div>
      </div>
    </main>
  </div>

  <script>
    const pizzasData = [
      { id: 1, name: "Margherita", desc: "Classic tomato sauce, fresh mozzarella, basil, olive oil", basePrice: 450 },
      { id: 2, name: "Pepperoni", desc: "Spicy pepperoni, mozzarella, signature tomato sauce", basePrice: 550 },
      { id: 3, name: "Quattro Formaggi", desc: "Mozzarella, gorgonzola, parmesan, provolone, cream base", basePrice: 650 },
      { id: 4, name: "Capricciosa", desc: "Ham, mushrooms, artichokes, olives, mozzarella, tomato sauce", basePrice: 600 },
      { id: 5, name: "Diabola", desc: "Spicy salami, hot chili peppers, mozzarella, red onions", basePrice: 580 },
      { id: 6, name: "Prosciutto e Funghi", desc: "Prosciutto cotto, fresh mushrooms, mozzarella, tomato sauce", basePrice: 590 },
      { id: 7, name: "BBQ Chicken", desc: "Grilled chicken breast, red onion, BBQ sauce, mozzarella", basePrice: 620 },
      { id: 8, name: "Vegetariana", desc: "Bell peppers, zucchini, eggplant, cherry tomatoes, mozzarella", basePrice: 520 }
    ];

    const state = {
      pizzas: pizzasData.map(p => ({ ...p, selectedSize: 25 })),
      cart: []
    };

    const tg = window.Telegram.WebApp;

    function init() {
      tg.ready();
      tg.expand();
      renderMenu();
      renderCart();
      setupEvents();
      updateMainButton();
    }

    function renderMenu() {
      const menuList = document.getElementById('menu-list');
      menuList.innerHTML = '';

      state.pizzas.forEach((pizza, index) => {
        const price = pizza.selectedSize === 35 ? pizza.basePrice + 250 : pizza.basePrice;
        const card = document.createElement('div');
        card.className = 'pizza-card';
        card.innerHTML = `
          <div class="pizza-header">
            <svg class="pizza-icon" viewBox="0 0 24 24" fill="var(--primary-red)">
              <circle cx="12" cy="12" r="10" stroke="var(--primary-red)" stroke-width="1.5" fill="none"/>
              <circle cx="12" cy="12" r="8" fill="var(--secondary-bg)"/>
              <circle cx="8" cy="9" r="1.5"/>
              <circle cx="15" cy="8" r="1.5"/>
              <circle cx="11" cy="15" r="1.5"/>
              <circle cx="16" cy="14" r="1.5"/>
            </svg>
            <div>
              <div class="pizza-title">${pizza.name}</div>
              <div class="pizza-desc">${pizza.desc}</div>
            </div>
          </div>
          <div class="size-selector">
            <button class="size-btn ${pizza.selectedSize === 25 ? 'active' : ''}" data-index="${index}" data-size="25">25 cm</button> #ИНТЕРАКТИВ
            <button class="size-btn ${pizza.selectedSize === 35 ? 'active' : ''}" data-index="${index}" data-size="35">35 cm</button> #ИНТЕРАКТИВ
          </div>
          <div class="card-bottom">
            <div class="price">${price} ₽</div>
            <button class="add-btn" data-index="${index}">Add</button> #ИНТЕРАКТИВ
          </div>
        `;
        menuList.appendChild(card);
      });
    }

    function renderCart() {
      const cartContainer = document.getElementById('cart-content');
      if (state.cart.length === 0) {
        cartContainer.innerHTML = '<div class="cart-empty">Cart is empty</div>';
        return;
      }

      cartContainer.innerHTML = '';
      state.cart.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'cart-item';
        itemEl.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-sub">${item.size} cm — ${item.price} ₽</div>
          </div>
          <div class="cart-item-controls">
            <button class="quantity-btn" data-action="decrease" data-index="${index}">-</button> #ИНТЕРАКТИВ
            <span class="quantity">${item.quantity}</span>
            <button class="quantity-btn" data-action="increase" data-index="${index}">+</button> #ИНТЕРАКТИВ
          </div>
        `;
        cartContainer.appendChild(itemEl);
      });
    }

    function calculateTotal() {
      return state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    function updateMainButton() {
      const total = calculateTotal();
      const address = document.getElementById('address').value.trim();

      if (state.cart.length > 0 && address.length > 0) {
        tg.MainButton.setText(`ORDER — ${total} ₽`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }

    function setupEvents() {
      document.getElementById('menu-list').addEventListener('click', (e) => {
        if (e.target.classList.contains('size-btn')) {
          const index = parseInt(e.target.dataset.index);
          const size = parseInt(e.target.dataset.size);
          state.pizzas[index].selectedSize = size;
          if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
          renderMenu();
        }

        if (e.target.classList.contains('add-btn')) {
          const index = parseInt(e.target.dataset.index);
          const pizza = state.pizzas[index];
          const price = pizza.selectedSize === 35 ? pizza.basePrice + 250 : pizza.basePrice;
          
          const existingIndex = state.cart.findIndex(
            item => item.id === pizza.id && item.size === pizza.selectedSize
          );

          if (existingIndex > -1) {
            state.cart[existingIndex].quantity += 1;
          } else {
            state.cart.push({
              id: pizza.id,
              name: pizza.name,
              size: pizza.selectedSize,
              price: price,
              quantity: 1
            });
          }

          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          renderCart();
          updateMainButton();
        }
      });

      document.getElementById('cart-content').addEventListener('click', (e) => {
        if (e.target.classList.contains('quantity-btn')) {
          const index = parseInt(e.target.dataset.index);
          const action = e.target.dataset.action;

          if (action === 'increase') {
            state.cart[index].quantity += 1;
          } else if (action === 'decrease') {
            state.cart[index].quantity -= 1;
            if (state.cart[index].quantity <= 0) {
              state.cart.splice(index, 1);
            }
          }

          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          renderCart();
          updateMainButton();
        }
      });

      document.getElementById('address').addEventListener('input', () => {
        updateMainButton();
      });

      tg.MainButton.onClick(() => {
        const address = document.getElementById('address').value.trim();
        if (state.cart.length === 0 || !address) return;

        const payload = {
          order: state.cart.map(item => ({
            name: item.name,
            size: `${item.size} cm`,
            quantity: item.quantity,
            price: item.price
          })),
          totalPrice: calculateTotal(),
          address: address,
          comment: document.getElementById('comment').value.trim()
        };

        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        tg.sendData(JSON.stringify(payload));
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
